[package]
name = "kelir-napi"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
kelir-engine = { path = "../../kelir-engine" }
kelir-interface = { path = "../../kelir-interface" }
kelir-otlp = { path = "../../kelir-otlp" }
kelir-storage = { path = "../../kelir-storage" }
kelir-storage-io = { path = "../../kelir-storage-io" }
kelir-wire = { path = "../../kelir-wire" }
kelir-terminal = { path = "../../kelir-terminal" }
kelir-checkpoint = { path = "../../kelir-checkpoint" }
kelir-host = { path = "../../kelir-host" }
napi = { version = "2.16", default-features = false, features = ["napi4", "async"] }
napi-derive = "2.16"
serde_json = { workspace = true }
tokio = { workspace = true }

[build-dependencies]
napi-build = "=2.1.0"

[lints]
workspace = true

[package.metadata.kelir]
allowed_levels = ["L1", "L2", "L3"]
