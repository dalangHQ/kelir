[package]
name = "kelir-integration"
version = "1.0.0"
edition = "2024"
license = "FSL-1.1-Apache-2.0"
publish = false

[dependencies]
kelir-engine = { path = "../kelir-engine" }
kelir-interface = { path = "../kelir-interface" }
kelir = { path = "../kelir", features = ["all-plugins"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true

[package.metadata.kelir]
allowed_levels = ["L1", "L2", "L3"]
