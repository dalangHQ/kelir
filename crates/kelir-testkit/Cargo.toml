[package]
name = "kelir-testkit"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-Apache-2.0"
authors = ["Kelir Contributors"]
rust-version = "1.85"
description = "Test plan verification harness: manifest parity checker, anti-slop linter, scorecard generator."
autobins = false

[[bin]]
name = "check-manifest"
path = "src/bin/check_manifest.rs"

[[bin]]
name = "anchors"
path = "src/bin/anchors.rs"

[[bin]]
name = "check-tests"
path = "src/bin/check_tests.rs"

[[bin]]
name = "scorecard"
path = "src/bin/scorecard.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
walkdir = "2"
driver-rustvmm = { path = "../kelir-drivers/driver-rustvmm" }

[lints]
workspace = true
