[package]
name = "kelir-testkit"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-Apache-2.0"
publish = false
authors = ["Kelir Contributors"]
rust-version = "1.85"
description = "Test plan verification harness: manifest parity checker, anti-slop linter, scenario tier validator, scorecard generator."
autobins = false

[[bin]]
name = "check-manifest"
path = "src/bin/check_manifest.run.rs"

[[bin]]
name = "anchors"
path = "src/bin/anchors_testkit.run.rs"

[[bin]]
name = "check-tests"
path = "src/bin/check_tests.run.rs"

[[bin]]
name = "check-scenarios"
path = "src/bin/check_scenarios.run.rs"

[[bin]]
name = "scorecard"
path = "src/bin/scorecard_testkit.run.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
walkdir = "2"
driver-rustvmm = { path = "../kelir-drivers/driver-rustvmm" }

[lints]
workspace = true

[package.metadata.kelir]
allowed_levels = ["L1", "L2", "L3"]
