[package]
name = "kelir-shim"
version = "1.0.0"
edition = "2024"
license = "FSL-1.1-Apache-2.0"

[dependencies]
blake3 = { workspace = true }
ciborium = { workspace = true }
kelir-interface = { path = "../kelir-interface" }
libc = { workspace = true }

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
