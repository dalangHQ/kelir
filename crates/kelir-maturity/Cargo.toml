[package]
name = "kelir-maturity"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-Apache-2.0"
publish = false
authors = ["Kelir Contributors"]
rust-version = "1.85"
description = "Maturity checker: AST containment keyed off file suffix and crate manifest metadata."

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
regex = "1"
walkdir = "2"
syn = { version = "3.0.9", features = ["full", "visit", "parsing", "clone-impls"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }

[lints]
workspace = true

[package.metadata.kelir]
allowed_levels = ["L1", "L2", "L3"]
role = "tooling"
