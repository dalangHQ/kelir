[package]
name = "kelir-transport"
version = "1.0.0"
edition = "2024"
license = "FSL-1.1-Apache-2.0"

[dependencies]
kelir-interface = { path = "../kelir-interface" }
libc = { workspace = true }
memmap2 = { workspace = true }
