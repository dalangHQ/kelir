[package]
name = "kelir-interface-macros"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"

[lints]
workspace = true

[package.metadata.kelir]
allowed_levels = ["L1", "L2"]
