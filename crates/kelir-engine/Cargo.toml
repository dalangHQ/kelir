[package]
name = "kelir-engine"
version = "1.0.0"
edition = "2024"
license = "FSL-1.1-Apache-2.0"
publish = false

[dependencies]
kelir-interface = { path = "../kelir-interface" }
kelir-transport = { path = "../kelir-transport" }
kelir-otlp = { path = "../kelir-otlp" }
kelir-catalog = { path = "../kelir-catalog" }
kelir-storage-io = { path = "../kelir-storage-io" }
serde = { workspace = true }
toml = { workspace = true }
ciborium = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
smoltcp = { version = "0.11", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }
libc = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
kelir-storage = { path = "../kelir-storage" }
kelir-storage-io = { path = "../kelir-storage-io" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[package.metadata.kelir]
allowed_levels = ["L1", "L2", "L3"]
