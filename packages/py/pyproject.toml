[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kelir"
version = "1.0.0"
description = "Kelir MicroVM Hypervisor Python SDK"
requires-python = ">=3.11"
license = { text = "FSL-1.1-Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "tomli-w>=1.0"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8"
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--ignore=packages/py/tests/red"
