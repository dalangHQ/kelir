# see: cans/02-plugin-model.md#Unified-builder
# see: cans/03-sdk-architecture.md#Rust-SDK
# see: cans/03-sdk-architecture.md#TypeScript-SDK
# see: cans/02-plugin-model.md#Fluent-plugin-creation-builder
# see: scripts/check-builder-parity.sh
schema:
  placement: flat on the builder, both flat and inside a scope, or registry for TS HookRegistry only
  scope: scope the verb lives in or opens, empty otherwise
  return: builder Self-this-KelirBuilder, sealed Rust Result Sealed else builder, terminal boot only, scope the scope type, registry HookRegistry this
  sdks: sdks the verb is required in, absence outside the list is not a failure
  status: fixed true pre-fix, target FIXED target differing pre-fix, pin A1 must pin the target
  cans_home: cans/artifacts/test-plan/builder-parity-verbs.yaml
verbs:
  plugin:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: mount by value; Py plugin is a creation-only descriptor, mount is use()
  plugin_instance:
    placement: flat
    return: builder
    sdks: rust
    status: fixed
    note: Rust-only trait-plugin mount; TS/Py mount trait plugins through use()
  seal:
    placement: flat
    return: sealed
    sdks: rust,ts,py
    status: fixed
    note: validation gate, not a mid-chain verb; in all three SDKs since the chain fix
  terminal:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: pty config verb, not the terminal of the chain
  storage:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: storage plane config verb
  wire:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: wire plane config verb
  params:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: params model verb; rust and ts retype the builder, py returns Self
  detached:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: detached session flag verb
  lock_broker:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: standalone host-only verb in all three SDKs since the chain fix
  fast_boot:
    placement: flat
    return: builder
    sdks: rust
    status: fixed
    note: Rust-only host verb; TS/Py have no fast_boot
  dax_window:
    placement: flat
    return: builder
    sdks: rust
    status: fixed
    note: Rust-only host verb; TS/Py have no dax_window
  context:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: context factory verb; rust and ts retype the builder, py returns Self
  require:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: dependency requirement verb; ts spells it requires
  scope:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: mount scope verb
  fork_with:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: forkWith in TS, fork_with in Rust/Py
  vsock_service:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: vsockService in TS, vsock_service in Rust/Py
  on_trap_deny:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: trap deny hook verb
  register_custom_action:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: target
    note: pre-fix missing in ts (A5 added py register_custom_action)
  register_stream_kind:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: target
    note: pre-fix missing in ts (A5 added py register_stream_kind)
  register_veto:
    placement: flat
    return: builder
    sdks: rust
    status: fixed
    note: Rust-only, on LifecycleMut (reached via lifecycle_mut); returns Self; TS/Py have no register_veto
  trap:
    placement: flat
    scope: trap
    return: builder
    sdks: rust,ts,py
    status: target
    note: flat filter form and scope-closure form are one verb; pre-fix rust flat form returns Result<Self
  trap_scope:
    placement: flat
    return: builder
    sdks: rust
    status: fixed
    note: Rust-only name for the scope form; TS/Py cover it with the overloaded trap
  group:
    placement: flat
    return: builder
    sdks: rust,ts
    status: fixed
    note: named block of chain steps; Python has no group()
  guard:
    placement: flat
    return: builder
    sdks: rust
    status: fixed
    note: Rust-only boolean conditional group
  fork_state:
    placement: flat
    return: builder
    sdks: ts,py
    status: fixed
    note: factory, not a chain verb; Rust fork_state is a KelirPlugin trait method, not a builder verb
  trap_async:
    placement: flat
    return: builder
    sdks: rust
    status: fixed
    note: Rust-only async trap form; returns Self since the chain fix
  post_exec:
    placement: flat
    return: builder
    sdks: rust
    status: fixed
    note: Rust-only post-exec gate; returns Self since the chain fix
  on:
    placement: flat
    return: builder
    sdks: ts
    status: pin
    note: ts-only generic lifecycle dispatcher; A1 to pin whether rust and py gain it
  derive:
    placement: flat
    return: builder
    sdks: ts
    status: pin
    note: ts-only context derivation verb; A1 to pin whether rust and py gain it
  use:
    placement: flat
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: mount verb in all three SDKs (Rust spells it r#use)
  fs:
    placement: flat
    scope: fs
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: opens the fs scope
  net:
    placement: flat
    scope: net
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: opens the net scope
  console:
    placement: flat
    scope: console
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: opens the console scope
  exec:
    placement: flat
    scope: exec
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: opens the exec scope
  host:
    placement: flat
    scope: host
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: opens the host scope
  lifecycle:
    placement: flat
    scope: lifecycle
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: opens the lifecycle scope
  telemetry:
    placement: flat
    scope: telemetry
    return: builder
    sdks: rust,ts,py
    status: fixed
    note: opens the telemetry scope
