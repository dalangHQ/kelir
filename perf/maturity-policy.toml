# perf/maturity-policy.toml
# L2 os-reach carve-out (converge decision, rename wave): the L2 os-reach forbid
# is about host side effects, not plumbing. L2 tolerates pure libc constants,
# std::net types with no IO, reads of a tool's own inputs (codegen, lockfile
# probe), and session-directory lifecycle. Guest-affecting IO and domain-trait
# impls are L3. The composition root (builder_sdk.flow.rs finish_boot, napi/pyo3
# bindings) calls the plane seams; it constructs no Real* type directly. Each
# plane .run.rs file holds a pub(crate) build_* fn returning Arc<dyn Trait>;
# the crate .flow.rs seam delegates to it. No .flow.rs file and no lib.rs
# names a Real* type.
# L2_max_delta_per_pr governs incremental PRs; the repo-wide rename wave
# exceeded it once by design (66 new L2 files), it still bounds later PRs.
# Concern-leak C1 (kelir-maturity check_tree): a crate with >=3 lib .run.rs
# files and zero .flow.rs files has no L2 seam in-crate; its Real* types stay
# pub-reachable past the composition root. src/bin/ entry points do not count.
# It follows forbid_mode like the S-rules: warns while this file says "warn",
# fails CI once forbid_mode flips to "error". Fixed by the seam wave
# (2026-11-13): one .flow.rs seam per plane crate; current hits are zero.
# The L3 virtqueue worker (FuseWorker, vr_10) and the RealFuseOps with_quota /
# with_lock_broker setters were deleted as dead code in the same wave; the
# worker returns when the L3 binding lands. Synthetic files already inject
# through kelir_storage::fuse_ops_with_synthetic_files.
[budget]
# was 20 until the maturity wave; it adds ~53 .flow.rs by design, mirroring
# the rename-wave precedent above; step back down once the wave lands.
L2_max_delta_per_pr = 60        # net new L2 files per PR, not net lines

# Rollout: content forbid rules and structural S1-S5 warn instead of failing
# while pre-wave leaks in the driver/transport/shim/testkit enclaves are
# cleaned up; absent means "error" (fail-closed default).
[policy]
forbid_mode = "warn"

[[level.L1.forbid]]
id = "impl-block"
pattern = '^\s*impl\b'
hint  = "L1 is contract: no impl blocks (derive attrs are fine)"

[[level.L1.forbid]]
id = "os-reach"
pattern = '\b(libc|std::fs|std::net|std::process|std::os|tokio::fs|tokio::net|tokio::process|block_on)\b'

[[level.L1.forbid]]
id = "trait-object"
pattern = '\bdyn\s+[A-Z]'
hint  = "trait objects are wiring (L2), not contract (L1)"

[[level.L2.forbid]]
id = "domain-trait-impl"
pattern = '^\s*impl\s+(FuseOps|StorageIo|TerminalOps|NetOps|DnsOps|UdpNatOps|TrapInterposer|FsInterposer|NetInterposer|LifecycleParticipant|SystemTelemetryParticipant)\s+for\b'
hint  = "domain trait impls are bodies (L3)"

[[level.L2.forbid]]
id = "os-reach"
pattern = '\b(libc|std::fs|std::net|std::process|std::os)\b'

[[level.L2.forbid]]
id = "direct-impl-construct"
pattern = '\bReal[A-Z]\w*::new\('
hint  = "the seam must go through Arc<dyn Ops>, not the concrete type"

[[level.L3.forbid]]
id = "trait-decl"
pattern = '^\s*(pub\s+)?trait\b'
hint  = "traits are contract (L1)"

[[level.L3.forbid]]
id = "interface-reexport"
pattern = '^\s*pub\s+(use|mod)\b.*\b(Ops|Interposer|Participant|Handle)\b'
hint  = "crate-level re-exports live in lib.rs (L2), not in bodies"

# advisory only — warn, do not fail
[[level.L2.warn]]
id = "dyn-any"
pattern = '\bdyn\s+Any\b'
hint  = "type erasure defeats the seam; prefer a typed handle"
