<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agentic Systems — Taxonomic Lineage Map</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-2: #1a202c;
    --panel-3: #222a3a;
    --border: #262e3f;
    --text: #e6e9f0;
    --muted: #8790a3;
    --muted-2: #6b7385;
    --accent: #7aa2f7;
    --openrig: #4a9eff;
    --openshell: #ff9a4a;
    --kelir: #4ade80;
    --guide: #2e3a56;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 13.5px; line-height: 1.5;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 20px;
    padding: 10px 18px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0; flex-wrap: wrap;
  }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .brand .sub { color: var(--muted); font-size: 11.5px; }
  .brand .sub b { color: var(--openrig); font-weight: 600; }
  .brand .sub i { color: var(--openshell); font-style: normal; font-weight: 600; }
  .brand .sub u { color: var(--kelir); text-decoration: none; font-weight: 600; }
  .stats { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls input {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 12.5px; width: 220px; outline: none;
  }
  .controls input:focus { border-color: var(--accent); }
  .controls button {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: background 0.15s;
  }
  .controls button:hover { background: var(--panel-3); }

  .layout {
    flex: 1; display: grid; grid-template-columns: 1fr 360px;
    min-height: 0; overflow: hidden;
  }
  aside {
    display: flex; flex-direction: column;
    background: var(--bg); min-height: 0; min-width: 0;
  }
  .species-bar {
    display: flex; gap: 6px; padding: 10px 12px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .species-bar button {
    flex: 1; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 11.5px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 6px; transition: all 0.15s;
  }
  .species-bar button:hover { transform: translateY(-1px); background: var(--panel-3); }
  .species-bar button .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .species-bar button.openrig { color: var(--openrig); }
  .species-bar button.openrig .dot { background: var(--openrig); }
  .species-bar button.openshell { color: var(--openshell); }
  .species-bar button.openshell .dot { background: var(--openshell); }
  .species-bar button.kelir { color: var(--kelir); }
  .species-bar button.kelir .dot { background: var(--kelir); }

  .tree { flex: 1; overflow: auto; padding: 6px 0 24px 0; min-height: 0; }
  .tree::-webkit-scrollbar { width: 10px; }
  .tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .tree::-webkit-scrollbar-thumb:hover { background: var(--panel-3); }

  .row {
    display: flex; align-items: center; gap: 6px; position: relative;
    padding: 3.5px 12px 3.5px 0; cursor: pointer; white-space: nowrap;
    user-select: none; margin-right: 8px; border-radius: 0 6px 6px 0;
    transition: background 0.1s;
  }
  /* Vertical tree lines: each expanded child group draws a guide at its
     parent's toggle centre (--gx), plus a horizontal stub into each child. */
  .kids { position: relative; }
  .kids::before {
    content: ''; position: absolute; top: 0; bottom: 0; left: var(--gx);
    border-left: 1px solid var(--guide); z-index: 1; pointer-events: none;
  }
  .kids > .row::before {
    content: ''; position: absolute; left: var(--gx); top: 50%;
    width: 15px; border-top: 1px solid var(--guide);
    z-index: 1; pointer-events: none;
  }
  .row:hover { background: var(--panel-2); }
  .row.selected {
    background: rgba(122, 162, 247, 0.12);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .row .toggle {
    width: 14px; text-align: center; color: var(--muted-2);
    font-size: 9px; flex-shrink: 0; transition: transform 0.15s; display: inline-block;
  }
  .row .toggle.open { transform: rotate(90deg); color: var(--muted); }
  .row .toggle.empty { visibility: hidden; }
  .row .name { overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .row.species-openrig .name { color: var(--openrig); font-weight: 600; }
  .row.species-openshell .name { color: var(--openshell); font-weight: 600; }
  .row.species-kelir .name { color: var(--kelir); font-weight: 600; }
  .row.species-openrig.selected { background: rgba(74, 158, 255, 0.15); box-shadow: inset 2px 0 0 var(--openrig); }
  .row.species-openshell.selected { background: rgba(255, 154, 74, 0.15); box-shadow: inset 2px 0 0 var(--openshell); }
  .row.species-kelir.selected { background: rgba(74, 222, 128, 0.15); box-shadow: inset 2px 0 0 var(--kelir); }

  main {
    overflow: auto; padding: 20px 22px; min-height: 0;
    border-left: 1px solid var(--border); background: var(--panel);
  }
  .insp-eyebrow {
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted-2); font-weight: 700; margin-bottom: 10px;
  }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  main::-webkit-scrollbar-thumb:hover { background: var(--panel-3); }

  .breadcrumb {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    color: var(--muted); font-size: 12px; margin-bottom: 16px;
  }
  .breadcrumb span.sep { color: var(--muted-2); }
  .breadcrumb a {
    color: var(--muted); text-decoration: none; cursor: pointer;
    padding: 1px 4px; border-radius: 3px;
  }
  .breadcrumb a:hover { color: var(--text); background: var(--panel-2); }
  .breadcrumb .current { color: var(--text); }

  .title-row {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap; margin-bottom: 6px;
  }
  .title-row h2 {
    margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.02em;
  }
  .badge {
    font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.06em;
    border: 1px solid var(--border); color: var(--muted);
    background: var(--panel-2); font-weight: 600;
  }
  .badge.species-openrig { color: var(--openrig); border-color: rgba(74,158,255,0.4); background: rgba(74,158,255,0.08); }
  .badge.species-openshell { color: var(--openshell); border-color: rgba(255,154,74,0.4); background: rgba(255,154,74,0.08); }
  .badge.species-kelir { color: var(--kelir); border-color: rgba(74,222,128,0.4); background: rgba(74,222,128,0.08); }

  .tagline {
    color: var(--muted); font-style: italic;
    margin: 4px 0 16px 0; font-size: 13px;
  }
  .description {
    margin: 14px 0 20px 0; font-size: 13.5px;
    line-height: 1.65;
  }
  .section { margin-bottom: 28px; }
  .section h3 {
    margin: 0 0 10px 0; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 600;
  }
  .meta-table {
    display: grid; grid-template-columns: max-content 1fr;
    gap: 8px 20px; font-size: 13px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 18px;
  }
  .meta-table dt { color: var(--muted); }
  .meta-table dd { margin: 0; color: var(--text); }

  .children-grid {
    display: grid; grid-template-columns: 1fr;
    gap: 8px;
  }
  .child-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; cursor: pointer;
    transition: all 0.15s; display: flex; flex-direction: column; gap: 4px;
  }
  .child-card:hover {
    background: var(--panel-2); border-color: var(--panel-3); transform: translateY(-1px);
  }
  .child-card .cc-name { font-weight: 500; font-size: 13px; }
  .child-card .cc-rank {
    font-size: 10px; color: var(--muted-2);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .child-card.species-openrig { border-left: 2px solid var(--openrig); }
  .child-card.species-openshell { border-left: 2px solid var(--openshell); }
  .child-card.species-kelir { border-left: 2px solid var(--kelir); }

  .landing h2 { font-size: 19px; margin: 0 0 12px 0; }
  .landing p { color: var(--muted); }
  .landing-cards {
    display: grid; grid-template-columns: 1fr;
    gap: 10px; margin: 18px 0;
  }
  .landing-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; cursor: pointer; transition: all 0.15s;
  }
  .landing-card:hover { transform: translateY(-2px); }
  .landing-card.openrig:hover { border-color: var(--openrig); }
  .landing-card.openshell:hover { border-color: var(--openshell); }
  .landing-card.kelir:hover { border-color: var(--kelir); }
  .landing-card .lc-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .landing-card.openrig .lc-title { color: var(--openrig); }
  .landing-card.openshell .lc-title { color: var(--openshell); }
  .landing-card.kelir .lc-title { color: var(--kelir); }
  .landing-card .lc-tag { font-style: italic; color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
  .landing-card .lc-desc { font-size: 12.5px; color: var(--text); opacity: 0.85; }
  .landing .hint { font-size: 12px; color: var(--muted-2); margin-top: 20px; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 56vh 1fr; }
    aside { border-bottom: 1px solid var(--border); }
    main { border-left: none; border-top: 1px solid var(--border); }
    .controls input { width: 160px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Agentic Systems — Taxonomic Lineage Map</h1>
    <span class="sub"><b>OpenRig</b> · <i>NVIDIA OpenShell</i> · <u>Kelir</u></span>
  </div>
  <div class="stats">

  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search nodes…  ( / )" />
    <button id="expand-all">Expand all</button>
    <button id="collapse-all">Collapse all</button>

</header>

<div class="layout">
  <aside>
    <div class="species-bar" id="species-bar"></div>
    <div class="tree" id="tree"></div>

</div>

<script>
(function() {
  const RAW = JSON.parse(document.getElementById('taxonomy-data').textContent);
  const DATA = RAW.root;

  const nodesById = {};
  function index(node, parent, ancestors) {
    node.parent = parent;
    node.ancestors = ancestors;
    node.depth = ancestors.length;
    nodesById[node.id] = node;
    const next = ancestors.concat([{ id: node.id, name: node.name }]);
    (node.children || []).forEach(function(c) { index(c, node, next); });
  }
  index(DATA, null, []);

  let nodeCount = 0, maxDepth = 0;
  Object.keys(nodesById).forEach(function(id) {
    nodeCount++;
    if (nodesById[id].depth > maxDepth) maxDepth = nodesById[id].depth;
  });
  document.getElementById('stat-nodes').textContent = nodeCount;
  document.getElementById('stat-depth').textContent = maxDepth;

  const expanded = new Set();
  Object.keys(nodesById).forEach(function(id) {
    if (hasChildren(nodesById[id])) expanded.add(id);
  });
  let selectedId = null;

  const treeEl = document.getElementById('tree');
  const detailEl = document.getElementById('detail');
  const searchEl = document.getElementById('search');

  function hasChildren(node) {
    return !!(node.children && node.children.length);
  }
  function matches(node, q) {
    if (!q) return true;
    if (node.name.toLowerCase().indexOf(q) !== -1) return true;
    if (node.desc && node.desc.toLowerCase().indexOf(q) !== -1) return true;
    return hasChildren(node) && node.children.some(function(c) { return matches(c, q); });
  }

  const INDENT = 22;
  function renderTree() {
    const q = searchEl.value.trim().toLowerCase();
    treeEl.innerHTML = '';
    const frag = renderNode(DATA, q);
    if (frag) treeEl.appendChild(frag);
  }
  function renderNode(node, q) {
    if (q && !matches(node, q)) return null;
    const frag = document.createDocumentFragment();
    frag.appendChild(makeRow(node, q));
    if (hasChildren(node)) {
      const open = q ? true : expanded.has(node.id);
      if (open) {
        const kids = document.createElement('div');
        kids.className = 'kids';
        kids.style.setProperty('--gx', (12 + node.depth * INDENT + 7) + 'px');
        node.children.forEach(function(c) {
          const cf = renderNode(c, q);
          if (cf) kids.appendChild(cf);
        });
        frag.appendChild(kids);
      }
    }
    return frag;
  }

  function makeRow(node, q) {
    const row = document.createElement('div');
    row.className = 'row';
    if (node.species) row.classList.add('species-' + node.species);
    if (node.id === selectedId) row.classList.add('selected');
    row.style.paddingLeft = (12 + node.depth * INDENT) + 'px';
    row.dataset.id = node.id;
    row.title = node.name + (node.desc ? '\n\n' + node.desc : '');

    const toggle = document.createElement('span');
    toggle.className = 'toggle';
    toggle.textContent = '\u25B8';
    if (!hasChildren(node)) {
      toggle.classList.add('empty');
    } else {
      const open = q ? true : expanded.has(node.id);
      if (open) toggle.classList.add('open');
    }
    toggle.addEventListener('click', function(e) {
      e.stopPropagation();
      if (!hasChildren(node)) return;
      if (expanded.has(node.id)) expanded.delete(node.id);
      else expanded.add(node.id);
      renderTree();
    });
    row.appendChild(toggle);

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = node.name;
    row.appendChild(name);

    row.addEventListener('click', function() { selectNode(node.id); });
    return row;
  }

  function selectNode(id) {
    const node = nodesById[id];
    if (!node) return;
    const q = searchEl.value.trim().toLowerCase();
    if (q && !matches(node, q)) searchEl.value = '';
    selectedId = id;
    node.ancestors.forEach(function(a) { expanded.add(a.id); });
    renderTree();
    renderDetail();
    const sel = treeEl.querySelector('.row.selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderLanding() {
    let html = '<div class="insp-eyebrow">Inspector</div><div class="landing">';
    html += '<h2>Taxonomic Map of Agentic Systems</h2>';
    html += '<p>Trace three species-level lineages from the abstract root to leaf-level instantiations. Each branch answers a different question about how agentic systems are built and governed.</p>';
    html += '<div class="landing-cards">';
    const speciesMeta = [
      { id: 'openrig', cls: 'openrig', title: 'OpenRig', tag: 'What shape should the multi-agent system take?', desc: 'Topology-first orchestrator. Defines the rig (YAML topology) and places agents into seats.' },
      { id: 'openshell', cls: 'openshell', title: 'NVIDIA OpenShell', tag: 'What is the agent allowed to touch?', desc: 'Hardware-rooted secure runtime. Sandbox, policy prover, and in-silicon quarantine.' },
      { id: 'kelir', cls: 'kelir', title: 'Kelir', tag: 'What execution substrate does the agent run on?', desc: 'In-process microVM microkernel. VirtIO rings, plugin graph, sub-60ms boots.' }
    ];
    speciesMeta.forEach(function(s) {
      html += '<div class="landing-card ' + s.cls + '" data-id="' + s.id + '">';
      html += '<div class="lc-title">' + escapeHtml(s.title) + '</div>';
      html += '<div class="lc-tag">' + escapeHtml(s.tag) + '</div>';
      html += '<div class="lc-desc">' + escapeHtml(s.desc) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    html += '<p class="hint">The tree is the main view — click any node to inspect it here. Press <b>/</b> to focus search. Click a species button above the tree to jump directly to its subtree.</p>';
    html += '</div>';
    detailEl.innerHTML = html;
    detailEl.querySelectorAll('.landing-card').forEach(function(card) {
      card.addEventListener('click', function() { selectNode(card.dataset.id); });
    });
  }

  function renderDetail() {
    if (!selectedId) { renderLanding(); return; }
    const node = nodesById[selectedId];

    let html = '<div class="insp-eyebrow">Inspector</div>';

    const crumbs = node.ancestors.concat([{ id: node.id, name: node.name }]);
    html += '<div class="breadcrumb">';
    crumbs.forEach(function(c, i) {
      if (i > 0) html += '<span class="sep">/</span>';
      if (i === crumbs.length - 1) {
        html += '<span class="current">' + escapeHtml(c.name) + '</span>';
      } else {
        html += '<a data-id="' + c.id + '">' + escapeHtml(c.name) + '</a>';
      }
    });
    html += '</div>';

    html += '<div class="title-row">';
    html += '<h2>' + escapeHtml(node.name) + '</h2>';
    if (node.rank) html += '<span class="badge">' + escapeHtml(node.rank) + '</span>';
    if (node.species) html += '<span class="badge species-' + node.species + '">' + escapeHtml(node.species) + '</span>';
    html += '</div>';

    if (node.tagline) html += '<div class="tagline">' + escapeHtml(node.tagline) + '</div>';
    if (node.desc) html += '<div class="description">' + escapeHtml(node.desc) + '</div>';

    if (node.meta) {
      html += '<div class="section"><h3>Key Facts</h3><dl class="meta-table">';
      Object.keys(node.meta).forEach(function(k) {
        html += '<dt>' + escapeHtml(k) + '</dt><dd>' + escapeHtml(node.meta[k]) + '</dd>';
      });
      html += '</dl></div>';
    }

    if (hasChildren(node)) {
      html += '<div class="section"><h3>Children (' + node.children.length + ')</h3><div class="children-grid">';
      node.children.forEach(function(c) {
        const sp = c.species ? ' species-' + c.species : '';
        html += '<div class="child-card' + sp + '" data-id="' + c.id + '">';
        html += '<div class="cc-name">' + escapeHtml(c.name) + '</div>';
        html += '<div class="cc-rank">' + escapeHtml(c.rank || '') + '</div>';
        html += '</div>';
      });
      html += '</div></div>';
    }

    detailEl.innerHTML = html;
    detailEl.scrollTop = 0;

    detailEl.querySelectorAll('.breadcrumb a').forEach(function(a) {
      a.addEventListener('click', function() { selectNode(a.dataset.id); });
    });
    detailEl.querySelectorAll('.child-card').forEach(function(card) {
      card.addEventListener('click', function() { selectNode(card.dataset.id); });
    });
  }

  // species bar
  const speciesBar = document.getElementById('species-bar');
  ['openrig', 'openshell', 'kelir'].forEach(function(sp) {
    const node = Object.keys(nodesById)
      .map(function(id) { return nodesById[id]; })
      .find(function(n) { return n.species === sp; });
    if (!node) return;
    const btn = document.createElement('button');
    btn.className = sp;
    btn.innerHTML = '<span class="dot"></span>' + escapeHtml(node.name);
    btn.addEventListener('click', function() { selectNode(node.id); });
    speciesBar.appendChild(btn);
  });

  document.getElementById('expand-all').addEventListener('click', function() {
    Object.keys(nodesById).forEach(function(id) {
      if (hasChildren(nodesById[id])) expanded.add(id);
    });
    renderTree();
  });
  document.getElementById('collapse-all').addEventListener('click', function() {
    expanded.clear();
    renderTree();
  });

  searchEl.addEventListener('input', function() { renderTree(); });

  document.addEventListener('keydown', function(e) {
    if (e.key === '/' && document.activeElement !== searchEl) {
      e.preventDefault();
      searchEl.focus();
    }
    if (e.key === 'Escape' && document.activeElement === searchEl) {
      searchEl.value = '';
      searchEl.blur();
      renderTree();
    }
  });

  renderTree();
  renderLanding();
})();
</script>
</body>
</html>
