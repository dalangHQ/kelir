  # ── Scope entry points (ring groups) ────────────────────────
  # see: cans/02-plugin-model.md#Nested-scopes
  # see: cans/artifacts/code/scope-builders.rs
  #
  # Each entry opens its scope for a closure; the entry itself carries
  # no verb meaning beyond opening the scope. trap is the exception: it
  # is also a flat filter verb, so it is placement both, not scoped-entry.
  - name: fs
    rust: fs
    typescript: fs
    python: fs
    placement: scoped-entry
    scope: null
    returns: builder
    args: "Rust fs(|s: FsScope| -> KelirBuilder); TS/Py (fn: (scope) => scope | void)"
    notes: Opens the fs scope; home of the on_fs_* ring verbs.

  - name: net
    rust: net
    typescript: net
    python: net
    placement: scoped-entry
    scope: null
    returns: builder
    args: "Rust net(|s: NetScope| -> KelirBuilder); TS/Py (fn: (scope) => scope | void)"
    notes: Opens the net scope; home of the on_net_* / on_socket_* / on_dns_query verbs.

  - name: console
    rust: console
    typescript: console
    python: console
    placement: scoped-entry
    scope: null
    returns: builder
    args: "Rust console(|s: ConsoleScope| -> KelirBuilder); TS/Py (fn: (scope) => scope | void)"
    notes: Opens the console scope; home of on_console_input / on_console_output.

  - name: exec
    rust: exec
    typescript: exec
    python: exec
    placement: scoped-entry
    scope: null
    returns: builder
