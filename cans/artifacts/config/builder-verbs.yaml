    notes: Opens the exec scope; home of the on_exec_* verbs.

  - name: host
    rust: host
    typescript: host
    python: host
    placement: scoped-entry
    scope: null
    returns: builder
    args: "Rust host(|s: HostScope| -> KelirBuilder); TS/Py (fn: (scope) => scope | void)"
    notes: Opens the host scope; home of the on_host_* verbs.

  - name: lifecycle
    rust: lifecycle
    typescript: lifecycle
    python: lifecycle
    placement: scoped-entry
