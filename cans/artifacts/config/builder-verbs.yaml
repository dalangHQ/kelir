# builder-verbs.yaml — machine-readable SSOT of the unified builder verb set.
#
# Owned by: cans/02-plugin-model.md#Unified-builder
# see: cans/02-plugin-model.md#Unified-builder
# see: cans/02-plugin-model.md#Chain-decisions
# see: cans/03-sdk-architecture.md#Unified-builder-surface
#
# Consumed by: scripts/check-builder-parity.sh (A6 CI gate). The gate reads
# this file, not the prose pin: every verb the gate checks must be listed
# here, and every verb listed here must exist in the named SDKs.
#
# Fields per verb:
#   name: canonical snake_case id (the Rust spelling, unless noted).
#   rust / typescript / python: the verb name per SDK; null means the SDK
#     has no such verb (use the note for the per-SDK equivalent, if any).
#   placement: flat (a direct method on the builder) | scoped-entry (the
#     scope entry point itself) | both (a flat verb also exposed in a scope).
#   scope: the scope entry name that also exposes a flat verb; null when
#     the verb has no scope form.
#   returns: builder (Self / this, the chain continues) | sealed-builder
#     (seal: Rust Result<Sealed>, TS this + sealed flag, Py Self) |
#     session (boot, the single terminal) | fresh-builder (a factory
#     returns a new plugin-mode builder) | bool | fused-trampoline |
#     lifecycle-guard (lifecycle_mut returns &mut LifecycleMut, not the
#     builder — the one verb that does not return the builder).
#   modes: both (host and plugin mode) | host (host-only).
#   kind: ring | structural | mount | validation | terminal | factory |
#     host-only | internal | reader.
#   status: per SDK — live | changed (live, but the chain fix changes its
#     shape) | new (does not exist live; the chain fix adds it) |
#     deleted (existed; the chain fix deletes it) | n/a (no such verb in
#     that SDK) | open-gap (pinned as not existing anywhere).
#   note: one line, only when the row needs it.
#
# Chain law (see: cans/02-plugin-model.md#Unbreakable-chain-contract):
# every verb with returns: builder returns the builder, never Result,
# void, or (); seal() is the only fallible chain step; boot() on Sealed
# is the single terminal; Rust has no boot() on Unsealed, TS/Py boot()
# seals implicitly.
#
# Closed set (spec): 30 chain verbs + 8 scopes in every SDK. This file
# lists 54 verbs because it also covers the host-only, mount,
# validation, terminal, factory, internal, and reader entries, so the
# gate can check the whole surface, not just the closed chain set.

schema: kelir-builder-verbs/v1

entries:
  - name: host-entry
    rust: KelirBuilder::new(config)
    typescript: new KelirBuilder(config)
    python: KelirBuilder(...)
    returns: builder
    note: TS also has the kelir(config) factory; Py also has kelir.builder(...).
  - name: plugin-entry
    rust: KelirBuilder::named(name)
    typescript: createPlugin(name, options?)
    python: KelirBuilder.plugin(name)
    returns: builder
    note: The plugin-mode factory. Py KelirBuilder.plugin(name) is the factory, not the deleted instance mount alias.

