    notes: >-
      Flat builder spelling is scope_timeout(d) (see scope-builders.rs);
      per-ring timeout ceiling enforced on hook return
      (cans/02-plugin-model.md#Per-ring-timeouts). Timeout → engine
      denial (VerdictKind::Timeout in HookSpan).

  - name: priority
    rust: priority
    typescript: priority
    python: priority
