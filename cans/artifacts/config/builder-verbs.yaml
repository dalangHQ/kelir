# ────────────────────────────────────────────────────────────────────
# Sync contract (scripts/check-builder-verbs-sync.py)
# ────────────────────────────────────────────────────────────────────
# The parity gate reads scripts/builder-parity-verbs.yaml, not this
# file. This file is the spec-side mirror of that machine SSOT, and the
# sync gate enforces the agreement. Rules it enforces:
#   1. every machine-file verb has an entry here (params maps to the
#      params + params_model overload split; both must exist);
#   2. every entry here has a machine-file verb, except params_model
#      (covered by machine-file params), requires (known-open: scope
#      requires is not yet gated), and the pinned future-surface
#      entries below, which must stay unimplemented in all three SDKs;
#   3. the non-null SDK columns cover the machine file's sdks set,
#      and the per-SDK spellings agree;
#   4. `placement`/`scope` agree after vocabulary normalization
#      (machine scoped == scoped-entry here for ring verbs).
# Adding a verb = one entry here + the machine-file entry + the three
# SDK spellings, in the same PR. The sync gate is the machine half of
# the "one builder surface" pin
# (cans/03-sdk-architecture.md#Unified-builder-surface); the prose half
# lives in cans/02-plugin-model.md#Unified-builder.

meta:
  version: 1
  owner: cans/02-plugin-model.md#Unified-builder
  gate: scripts/check-builder-parity.sh
  # Set below by hand when a deliberate per-SDK spelling divergence is
  # added, so the gate can distinguish "intended keyword outlier" from
  # "accidental drift". Keep sorted.
  known_divergences:
    - use            # Rust use_plugin (`use` is a keyword)
    - requires       # Py/TS `require` vs Rust `requires` at scope level
    - register       # scope method; flat ids keep register_custom_action / register_stream_kind
    - memory_mb      # TS memoryMb
    - tsc_locked     # TS tscLocked
