    notes: Opens the telemetry scope; home of on_memory_pressure / on_heartbeat / on_watchdog.

  - name: trap
    rust: trap
    typescript: trap
    python: trap
    placement: both
    scope: trap
    returns: builder
    args: "Rust trap(filter, handler) and trap_scope(|s: TrapScope| -> KelirBuilder); TS/Py overloaded trap(filter, handler) / trap((scope) => scope | void)"
    notes: Flat filter form and scope-closure form are one verb; Py takes a callable pattern for the scope form.

  # ── Shared scope sub-nodes (placement: both) ────────────────────
  # see: cans/02-plugin-model.md#Nested-scopes
  # see: cans/artifacts/code/scope-builders.rs
  #
  # These six exist on EVERY ring scope (and the five orphan scopes in
  # Part 3) and are ALSO reachable as flat builder verbs. The `name`
  # column pins the canonical scope spelling; the flat builder spelling
  # is noted where it differs (scope_timeout, scope_priority, scope_rules).
  - name: config
    rust: config
    typescript: config
    python: config
    placement: scoped
    scope: fs
    returns: scope
    args: "per-scope fields; fs: (lock_broker?, carryover_bytes?, scan_engine?, snoops?)"
    notes: >-
      Flat builder form is ring-specific (fs_config, trap_config, …).
      Python accepts keyword args (lock_broker=…); Rust takes positional
      Option<_>; TS takes one object literal. Field order pinned by
      owning ring artifact.

  - name: requires
    rust: requires
    typescript: requires
    python: require
    placement: both
    scope: all
    returns: scope
    args: "Rust requires::<P>(); TS requires<Req extends string>(); Py require(plugin: type | str)"
    notes: >-
      Spelling divergence is deliberate (A6 parity: Rust/TS generic,
      Python runtime value). Populates the same Deps registry that
      builder.boot() walks; there is no second dependency list
      (see cans/03-sdk-architecture.md#Service-lookup-across-languages).

  - name: fork_with
    rust: fork_with
    typescript: forkWith
    python: fork_with
    placement: both
    scope: fs
    returns: scope
    args: "Rust fork_with::<F>(f: F) where F: Fn(&str) -> Box<dyn AnyPlugin>; TS/Py fn"
    notes: >-
      Scope-level fork policy; overrides the plugin's fork_state() for
