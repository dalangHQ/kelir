# builder-verbs.yaml — spec-side mirror of the unified builder verb set.
#
# Owned by: cans/02-plugin-model.md#Unified-builder
# see: cans/02-plugin-model.md#Unified-builder
# see: cans/02-plugin-model.md#Chain-decisions
# see: cans/03-sdk-architecture.md#Unified-builder-surface
#
# This file is the spec-side mirror of scripts/builder-parity-verbs.yaml,
# which is the machine SSOT the parity gate reads. The mirror carries the
# same verb set plus per-verb args signature summaries and notes, which
# the machine schema has no fields for. scripts/check-builder-verbs-sync.py
# keeps the two in agreement; a verb added to either file without its
# counterpart fails that gate. The earlier claim that the parity gate
# reads this file was false; the gate never read it.
#
# Fields per verb:
#   name: canonical snake_case id (the Rust spelling, unless noted).
#   rust / typescript / python: the verb name per SDK; null means the SDK
#     has no such verb (use the note for the per-SDK equivalent, if any).
#     A null column the sync gate does not expect fails the sync.
#   placement: flat (a direct method on the builder) | scoped-entry (the
#     scope entry point itself) | both (a flat verb also exposed in a scope).
#     | scoped (reachable ONLY inside the named scope; no flat builder
#     equivalent — every orphan-scope register verb is `scoped`, so the
#     flat chain cannot reach it and the scope is the only home).
#     | registry (a TS HookRegistry mutator, not a builder verb).
#   scope: the scope entry name that also exposes a flat verb; null when
#     the verb has no scope form; all when the verb lives in every scope.
#   returns: builder (Self / this, the chain continues) | sealed-builder
#     (seal: Rust Result<Sealed>, TS this + sealed flag, Py Self) |
#     session (boot, the terminal step; no further builder verbs) |
#     scope (a scoped verb; the chain stays on the scope) |
#     void (a host-only register verb with no builder continuation) |
#     registry (a HookRegistry method returning this).
#   args: free-form summary of the call-site signature shape, for the
#     A6 gate's arity check. Not a type signature; types live in the
#     owning SDK artifact.
#   notes: per-SDK divergences worth pinning (keyword outliers,
#     deprecated spellings, etc.).
#
# Parity rule (A6): a verb is green only when every non-null SDK
# column resolves and the `placement` agrees across SDKs. A null SDK
# column is a deliberate absence (e.g. Rust has no `.end()` on TS-style
# scopes; TS/Py have no `.end()` at all), never a bug. Entries under
# the pre-boot plane setters that no SDK implements yet are pinned
# future surface, not live verbs: the sync gate fails if any SDK gains
# one without the machine file gaining the verb.
#
# This file pins verbs, not handlers: the handler predicates
# (TrapFilter grammar) live in trap-filter-predicates.rs; the ring
# traits live in rust-plugin-builder-scopes.rs / scope-builders.rs.

verbs:
  # ── Lifecycle ring ──────────────────────────────────────────────
  # see: cans/02-plugin-model.md#Unified-builder
  # see: cans/artifacts/code/rust-plugin-builder-scopes.rs
  - name: on_vm_init
    rust: on_vm_init
    typescript: onVmInit
    python: on_vm_init
    placement: scoped-entry
    scope: lifecycle
    returns: scope
    args: "async (c: LifecycleCtx) => Result<(), PluginError>"
    notes: Rust binds &mut LifecycleCtx<'_> and returns a boxed Send future.

  - name: on_vm_ready
    rust: on_vm_ready
    typescript: onVmReady
    python: on_vm_ready
    placement: scoped-entry
    scope: lifecycle
    returns: scope
    args: "async (c: LifecycleCtx) => Result<(), PluginError>"
    notes: null

  - name: on_vm_shutdown
    rust: on_vm_shutdown
    typescript: onVmShutdown
    python: on_vm_shutdown
    placement: scoped-entry
    scope: lifecycle
    returns: scope
    args: "async (c: LifecycleCtx) => Result<(), PluginError>"
    notes: null

  - name: on_pre_commit
    rust: on_pre_commit
    typescript: onPreCommit
    python: on_pre_commit
    placement: scoped-entry
    scope: lifecycle
    returns: scope
    args: "async (c: LifecycleCtx) => Result<(), PluginError>"
    notes: Pauses guest vCPUs and drains FUSE in-flight ops (transaction plugin).

  - name: on_post_commit
    rust: on_post_commit
    typescript: onPostCommit
    python: on_post_commit
    placement: scoped-entry
    scope: lifecycle
    returns: scope
    args: "async (c: LifecycleCtx, committed: bool) => Result<(), PluginError>"
    notes: committed=true → broker commit + SQL COMMIT; false → discard + ROLLBACK.

  - name: register_veto
    rust: register_veto
    typescript: null
    python: null
    placement: scoped-entry
    scope: lifecycle
    returns: scope
    args: "(event: VetoEvent, callback: () => bool)"
    notes: Rust-only. Veto only on the events named in VetoEvent::Fork and peers.

  # ── Trap ring ───────────────────────────────────────────────────
