name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUST_BACKTRACE: 1

jobs:
  # ─── 0. SPEC GATE (merge-blocking, path-filter-free) ───────
  # Corpus is a typed graph; this compiles it. Every see:, every
  # duplicate-home, every node_vs_artifact invariant in _rules.yaml
  # is a red X when it rots. No filter: a node edit can break a
  # pointer in any other node.
  cans-check:
    runs-on: ubuntu-latest
    env:
      CANS_REPO: ${{ vars.CANS_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cans
        run: cargo install --git "${CANS_REPO:?set repo var}" cans-cli --locked
      - name: Refs only (<2s)
        run: |
          out=$(cans check --refs-only --json)
          echo "$out" | jq -e '.ok == true and .exitCode == 0' >/dev/null
      - name: Full check
        run: |
          out=$(cans check --json)
          echo "$out" | jq -e '.ok == true and .exitCode == 0' >/dev/null
      - name: Touched files within write budget
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > /tmp/touched
          cans check --touched-files /tmp/touched --json \
            | jq -e '.ok == true and .exitCode == 0' >/dev/null

  # ─── 1. FAST STATIC GATE (<90s) ────────────────────────────
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: astral-sh/setup-uv@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.5

      - name: Rust Lints
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --exclude kelir-shim -- -D warnings

      - name: Type Checks (TS & Python)
        run: |
          pnpm install --frozen-lockfile
          pnpm -r exec tsc --noEmit
          uv venv && uv pip install -e "packages/py[dev]"
          uv run mypy packages/py

  # ─── 2. GUEST SHIM CROSS-COMPILE ────────────────────────────
  build-guest-shim:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mozilla-actions/sccache-action@v0.0.5
      - uses: taiki-e/install-action@cargo-zigbuild
      - name: Build Shim via Zig Linker
        run: cargo zigbuild -p kelir-shim --release --target ${{ matrix.target }}
      - name: Verify Size (<50KB binary constraint)
        run: |
          SIZE=$(stat -c%s target/${{ matrix.target }}/release/kelir-shim)
          echo "Shim size: $SIZE bytes"
          test $SIZE -lt 51200 || (echo "SHIM BLOAT DETECTED" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: kelir-shim-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kelir-shim

  # ─── 3. CORE KERNEL + PLUGIN TESTKIT ───────────────────────
  test-core:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Core + testkit
        run: cargo nextest run -p kelir-core -p kelir-plugin-testkit

  # ─── 3b. MULTI-LANGUAGE PARITY & SDK EXECUTION GATE ────────
  # Merge-blocking. Executes TS and Python test suites (ForeignPluginProxy,
  # memory pinning, unhandled freeze recovery), testkit vectors, and AST diff.
  parity:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: astral-sh/setup-uv@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Build bindings
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kelir/core build
          uv venv && uv pip install -e "packages/py[dev]"
      - name: Execute TypeScript SDK tests
        run: pnpm --filter @kelir/core test
      - name: Execute Python SDK tests
        run: uv run pytest packages/py
      - name: Parity
        run: cargo run -p kelir-plugin-cli -- parity run

  # ─── 3c. ZERO-TOOLCHAIN PACKAGING CHECK ────────────────────
  # Asserts precompiled NAPI binaries and Python wheels build cleanly
  # so consumers never require C/Rust compilers on target systems.
  package-check:
    needs: [parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: astral-sh/setup-uv@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify NAPI packaging
        run: pnpm --filter @kelir/core pack --dry-run
      - name: Verify Python wheel packaging
        run: uv build --package kelir

  # ─── 4. PER-PLUGIN TEST MATRIX ─────────────────────────────
  # Each plugin's tests run against its explicit upstream dependencies.
  # A failure in one cell does not mask others (fail-fast: false).
  test-plugins:
    needs: [lint-and-types, test-core]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [chaos, container, db-proxy, ledger, mcp, mesh, profile, replay, supply-chain, tool-guard, transaction, vault, wire-ingress]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Test plugin-${{ matrix.plugin }}
        run: cargo nextest run -p plugin-${{ matrix.plugin }}

  # ─── 4a. PLUGIN DEPENDENCY DAG CHECK ──────────────────────
  plugin-graph:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Validate Acyclic Plugin Dependency DAG
        run: cargo run -p kelir-plugin-cli -- check --graph

  # ─── 4b. PLUGIN CONTRACT AUDIT ─────────────────────────────
  # Same command as `just check-plugin`. The audit that
  # 11-operations.md promises is actually executed here.
  plugin-audit:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [chaos, container, db-proxy, ledger, mcp, mesh, profile, replay, supply-chain, tool-guard, transaction, vault, wire-ingress]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Contract audit
        run: cargo run -p kelir-plugin-cli -- check -p plugin-${{ matrix.plugin }}

  # ─── 4c. TIERED PLUGIN COMPILATION ─────────────────────────
  # Plugins compile against their explicit upstream dependencies
  # (see 02-plugin-model.md#Plugin-tiering). One workspace check
  # covers every crate and target, plugins included.
  verify-tiered-compilation:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Verify Tiered Plugin Compilation
        run: cargo check --workspace --all-targets

  # ─── 5. SHIM + DRIVER TESTS ────────────────────────────────
  test-shim:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - run: cargo nextest run -p kelir-shim

  test-drivers:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Driver unit tests (excludes real-hardware paths)
        run: cargo nextest run -p driver-rustvmm -p driver-openvmm -p driver-bwrap -E 'not test(test_hw_)'

  # ─── 6. CROSS-PLUGIN INTEGRATION (needs KVM) ───────────────
  # continue-on-error: GitHub-hosted runners usually lack /dev/kvm.
  # Set vars.KELIR_RUNNER to a self-hosted label to run for real.
  test-integration:
    needs: [test-plugins, test-drivers]
    runs-on: ${{ vars.KELIR_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Detect KVM
        id: kvm
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No KVM; skipping kelir-integration"
          fi
      - name: Integration suite
        if: steps.kvm.outputs.available == 'true'
        run: cargo nextest run -p kelir-integration

  # ─── 6b. WINDOWS TRANSPORT CONFORMANCE (transport only) ───
  # GitHub-hosted cells run transport unit tests only: SPSC ring path
  # and named-pipe fallback path. No AF_VSOCK assumptions may leak into
  # shared code. Full workflow runs on self-hosted Windows WHP runners.
  transport-windows:
    needs: [lint-and-types]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Transport conformance (SPSC rings + named pipes only)
        run: cargo nextest run -p kelir-transport

  # ─── 7. MACOS APPLE SILICON GATE (Zero Bloat) ──────────────
  check-macos-hvf:
    needs: [lint-and-types]
    runs-on: macos-14 # Apple Silicon M1 (Free tier on GitHub Actions for public repos)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      # Verify compilation of native Apple Silicon HVF driver
      - name: Check native HVF driver
        run: cargo check -p driver-hvf

