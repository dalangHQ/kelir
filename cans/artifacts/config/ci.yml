name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUST_BACKTRACE: 1

# Test-plan stages (work-order.md Phase 6): 1 Fast Gate, 2 Linux KVM,
# 3 macOS HVF, 4 Windows WHP, 5 SDK Parity, 6 Scorecard Aggregator.
# Pre-existing jobs that are not part of the 6 stages are kept verbatim
# as named jobs below the stages; nothing is dropped.
#
# Corrections to the work-order, verified against the live tree:
# - SDK parity vectors live at ./vectors.json (repo root); the
#   work-order's tests/vectors/vectors.json does not exist.
# - The invariant total is 254, not 208 (196 + 12 adapters_ingestion
#   + 4 concurrency/fault-injection + 6 bindings + 22 coverage-gap
#   + 5 pe_17-21 + 9 work-order-3 cases); the aggregator asserts 254
#   against manifest truth.
# - platform_target exists on all 254 cases, but no nextest tag maps
#   cases to Rust tests, so the tier jobs run each platform's
#   nextest invocation over crates with no test targets at base
#   (see the per-job comments). Strict platform_target tag
#   filtering is future work, not wired here.

jobs:
  # ─── STAGE 1. FAST GATE (Linux x86) ─────────────────────────
  # Lint, AST analysis (check-tests), manifest validation
  # (check-manifest), docs + CANS spec check (cans check --refs-only,
  # via just check-spec which runs refs-only + full).
  # ─── 1a. SPEC GATE (merge-blocking, path-filter-free) ───────
  # Corpus is a typed graph; this compiles it. Every see:, every
  # duplicate-home, every node_vs_artifact invariant in _rules.yaml
  # is a red X when it rots. No filter: a node edit can break a
  # pointer in any other node.
  cans-check:
    runs-on: ubuntu-latest
    env:
      CANS_REPO: ${{ vars.CANS_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - name: Install cans
        run: cargo install --git "${CANS_REPO:?set repo var}" cans-cli --locked
      # Flag-drift gate: CI calls just check-spec, not raw cans flags.
      # The flag string lives only in the justfile.
      - name: Spec gate (refs-only + full)
        run: just check-spec
      - name: Plugin coverage (--plugin-coverage)
        run: just check-plugin-coverage
      - name: Examples canonical (--examples-canonical)
        run: just check-examples-canonical
      - name: Builder parity (--builder-parity)
        run: just check-builder-parity
      - name: Touched files within write budget
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > /tmp/touched
          just check-spec-touched

  # ─── EXAMPLES COMPILE (Stage 1, merge-blocking, path-filter-free) ─
  # Canonical SSOT examples in cans/artifacts/examples/ must compile /
  # typecheck in all three languages: a broken example is a lying spec,
  # users copy these. No path filter: an SDK change anywhere can break
  # an example, so this runs on every push/PR. Runs just check-examples,
  # which checks each language and does not stop at the first failure.
  # A dedicated job, not a cans-check step: cans-check has only Rust +
  # just + cans, and this gate needs Node/pnpm and uv as well.
  examples-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: astral-sh/setup-uv@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - uses: taiki-e/install-action@just
      - name: Install JS + Python SDK dependencies
        run: |
          pnpm install --frozen-lockfile
          uv venv && uv pip install -e "packages/py[dev]"
      - name: Examples compile / typecheck (Rust + Python + TypeScript)
        run: just check-examples

  # ─── 1b. SMOKE SCENARIO PRE-GATE (<60s) ─────────────────────────
  # Fast scenario-tier gate: validates scenarios/smoke/ before the
  # full manifest job runs. 60-second wall budget on the validation
  # run, enforced by timeout(1); build time is outside the budget.
  smoke-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Smoke tier gate (scenarios/smoke/, 60s wall budget)
        run: |
          cargo build -p kelir-testkit --bin check-scenarios
          timeout 60 cargo run -p kelir-testkit --bin check-scenarios -- --family smoke

  # ─── 1c. FAST STATIC GATE (<90s) ────────────────────────────
  lint-and-types:
    needs: smoke-scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: astral-sh/setup-uv@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.5
      - uses: taiki-e/install-action@just

      - name: Enforce Code Hygiene (LOC & Out-of-tree Tests)
        run: |
          OVERSIZED=$(find crates -name "*.rs" -exec wc -l {} + | awk '$1 > 1000 && $2 != "total" {print $2 " (" $1 " lines)"}')
          if [ -n "$OVERSIZED" ]; then
            echo "ERROR: Files exceed strict 1,000 LOC limit:" && echo "$OVERSIZED" && exit 1
          fi
          INLINE_TESTS=$(grep -rn --include="*.rs" '#\[cfg(test)\]' crates/*/src/ || true)
          if [ -n "$INLINE_TESTS" ]; then
            echo "ERROR: Inline #[cfg(test)] detected in src/. Move tests to tests/:"
            echo "$INLINE_TESTS" && exit 1
          fi
          UNSAFE_VIOLATIONS=$(grep -rn --include="*.rs" 'unsafe ' crates/ | grep -v 'crates/kelir-drivers/' | grep -v 'crates/kelir-transport/' | grep -v 'crates/kelir-shim/' || true)
          if [ -n "$UNSAFE_VIOLATIONS" ]; then
            echo "ERROR: Unsafe code detected outside driver/transport/shim enclaves:"
            echo "$UNSAFE_VIOLATIONS" && exit 1
          fi

      - uses: taiki-e/install-action@cargo-deny
      - name: License gate (cargo-deny)
        run: cargo deny check licenses

      - name: Validate Crate Layering Hierarchy
        run: cargo run -p kelir-plugin-cli -- check --layers

      - name: Rust Lints
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --exclude kelir-shim -- -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::unimplemented \
            -D clippy::todo \
            -D clippy::unreachable

      # ── Zero-drift coherence gate (work-order-2: CI/CD Coherence Architecture) ──
      # Regenerates every generated artifact (TS/PY SDK types, plugin
      # projections, fusion tables, UAPI tables, anchors, scorecard) and
      # requires the committed tree to stay byte-identical. Runs before
      # every test job (all of them need: [lint-and-types]).
      - name: Codegen coherence gate (just check-coherence)
        run: just check-coherence

      - name: Type Checks (TS & Python)
        run: |
          pnpm install --frozen-lockfile
          pnpm -r exec tsc --noEmit
          pnpm --filter @kelir/core run typecheck
          uv venv && uv pip install -e "packages/py[dev]"
          uv run --no-project mypy packages/py

      # Test-plan gates: manifest validation + AST anti-slop + scenario tier.
      - name: Manifest validation (check-manifest)
        run: just check-manifest
      - name: AST anti-slop analysis (check-tests)
        run: just check-tests
      - name: Scenario tier validation (check-scenarios)
        run: just check-scenarios

  # ─── STAGE 2. LINUX KVM TIER (Linux x86) ────────────────────
  # Cases with platform_target.hypervisor: kvm, via cargo nextest.
  # No nextest tag maps cases to Rust tests, so this runs the
  # KVM subset: kelir-integration (no integration tests at base),
  # gated on /dev/kvm.
  # continue-on-error is deliberately NOT set: a real KVM failure
  # must fail the job. No KVM on the runner is an explicit skip
  # (notice + skipped-no-kvm tier result), never a fake pass.
  # Set vars.KELIR_RUNNER to a self-hosted label to run for real.
  linux-kvm-tier:
    needs: [test-plugins, test-drivers]
    runs-on: ${{ vars.KELIR_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Detect KVM
        id: kvm
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No KVM; skipping kelir-integration"
          fi
      - name: Integration tier (no kelir-integration tests at base)
        if: steps.kvm.outputs.available == 'true'
        run: cargo nextest run -p kelir-integration
      # --no-tests pass: the filter selects the 9 work-order-3 stubs in
      # kelir-integration/tests/full_pipeline_test.rs (#[ignore], run via
      # test-red); it must not fail the run when the stubs are absent.
      # Scoped to kelir-integration; -p kelir-engine --lib is wrong here —
      # the kelir-engine integration suite does not compile at base
      # (receipt_attest_test.rs E0063, pre-existing).
      - name: Fast-boot and DAX coverage
        run: cargo nextest run -p kelir-integration -E 'test(hd_fast_boot) | test(sp_dax) | test(lc_base_snapshot)' --no-tests pass
      - name: Budgets gate
        run: cargo run -p kelir-plugin-cli -- check --budgets perf/budgets.toml
      - name: Record tier result
        if: always()
        run: |
          mkdir -p test-results
          if [ "${{ steps.kvm.outputs.available }}" = "true" ]; then
            STATUS="${{ job.status }}"
          else
            STATUS="skipped-no-kvm"
          fi
          printf '{"tier": "linux-kvm", "status": "%s"}\n' "$STATUS" > test-results/linux-kvm.json
          i=0
          for f in $(find target/nextest -name junit.xml 2>/dev/null); do
            i=$((i + 1))
            cp "$f" "test-results/junit-$i.xml"
          done
          cat test-results/linux-kvm.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux-kvm
          path: test-results/

  # ─── STAGE 3. MACOS HVF TIER (macOS ARM64) ──────────────────
  # Cases with platform_target.hypervisor: hvf, filtered strictly
  # via tag. No nextest tag maps cases to Rust tests yet, so
  # this runs nextest over driver-hvf (no driver-hvf tests at base;
  # real-hardware paths stay excluded via test_hw_*).
  # Strict tag filtering lands with the platform_target schema work.
  macos-hvf-tier:
    needs: [lint-and-types]
    runs-on: macos-14 # Apple Silicon M1 (Free tier on GitHub Actions for public repos)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      # Nextest over the native Apple Silicon HVF driver (macOS runners
      # have hypervisor entitlements; no driver-hvf tests at base)
      - name: Test native HVF driver (no tests at base)
        run: cargo nextest run -p driver-hvf -E 'not test(test_hw_)'
      # Same --no-tests pass form as the linux-kvm-tier step, scoped to
      # kelir-integration: selects the 9 work-order-3 stubs; no hypervisor
      # needed (stubs are #[ignore]).
      - name: Fast-boot and DAX coverage
        if: runner.os == 'macOS'
        run: cargo nextest run -p kelir-integration -E 'test(hd_fast_boot) | test(sp_dax) | test(lc_base_snapshot)' --no-tests pass
      - name: Budgets gate
        if: runner.os == 'macOS'
        run: cargo run -p kelir-plugin-cli -- check --budgets perf/budgets.toml
      - name: Record tier result
        if: always()
        run: |
          mkdir -p test-results
          printf '{"tier": "macos-hvf", "status": "%s"}\n' "${{ job.status }}" > test-results/macos-hvf.json
          i=0
          for f in $(find target/nextest -name junit.xml 2>/dev/null); do
            i=$((i + 1))
            cp "$f" "test-results/junit-$i.xml"
          done
          cat test-results/macos-hvf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-macos-hvf
          path: test-results/

  # ─── STAGE 4. WINDOWS WHP TIER (Self-hosted Windows) ────────
  # Cases with platform_target.hypervisor: whp.
  # OPEN: no self-hosted Windows runner is configured in-repo — the
  # only runner variable that exists is vars.KELIR_RUNNER (Linux).
  # Until a Windows self-hosted label (e.g. vars.KELIR_RUNNER_WINDOWS)
  # is configured, this job runs nextest over kelir-transport and
  # driver-openvmm on windows-latest (no tests in either crate at
  # base; real-hardware paths excluded). The WHP hardware tier is NOT
  # run here and NOT faked as passing.
  windows-whp-tier:
    needs: [lint-and-types]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      # GitHub-hosted cells run nextest over kelir-transport only: SPSC ring
      # path and named-pipe fallback path (no transport tests at base).
      # No AF_VSOCK assumptions may leak into shared code. Full workflow
      # runs on self-hosted Windows WHP runners.
      - name: Transport conformance (SPSC rings + named pipes only; no tests at base)
        run: cargo nextest run -p kelir-transport
      - name: Windows driver tests (no driver-openvmm tests at base; excludes real-hardware paths)
        run: cargo nextest run -p driver-openvmm -E 'not test(test_hw_)'
      - name: Fast-boot and DAX skip notice
        run: echo "::notice::FAST-BOOT and DAX not supported on WHP; skipping"
      - name: Record tier result
        if: always()
        shell: bash
        run: |
          mkdir -p test-results
          printf '{"tier": "windows-whp", "status": "%s"}\n' "${{ job.status }}" > test-results/windows-whp.json
          i=0
          for f in $(find target/nextest -name junit.xml 2>/dev/null); do
            i=$((i + 1))
            cp "$f" "test-results/junit-$i.xml"
          done
          cat test-results/windows-whp.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-whp
          path: test-results/

  # ─── STAGE 5. SDK PARITY GATE ───────────────────────────────
  # Merge-blocking. Executes the TS and Python parity steps (no TS test
  # script and no Python test files exist at base), testkit vectors, and AST diff.
  # Parity vectors live at ./vectors.json (repo root); the work-order's
  # tests/vectors/vectors.json does not exist (verified in-tree).
  sdk-parity-gate:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: astral-sh/setup-uv@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Vectors file is ./vectors.json at repo root
        run: |
          test -f ./vectors.json
          test ! -f tests/vectors/vectors.json
      - name: Build bindings
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
          uv venv && uv pip install -e "packages/py[dev]"
      - name: Execute TypeScript SDK tests (node --test)
        run: pnpm -r test
      - name: Execute Python SDK tests (pytest)
        run: uv run --no-project pytest packages/py
      - name: Parity
        run: cargo run -p kelir-plugin-cli -- parity run
      - name: Record tier result
        if: always()
        run: |
          mkdir -p test-results
          printf '{"tier": "sdk-parity", "status": "%s"}\n' "${{ job.status }}" > test-results/sdk-parity.json
          cat test-results/sdk-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-sdk-parity
          path: test-results/

  # ─── EXPECTED-FAIL RED SUITE (work-order Phase 0.2) ────────
  # Every red test must fail with the signature recorded in the
  # case-to-test map: every language reports exactly its map red count
  # and 0 passes (Rust nextest ignored-only, TS node --test over
  # packages/ts/core/tests/red, Python pytest over packages/py/tests/red).
  # A red test that passes, errors, or miscounts fails this stage.
  test-red:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: astral-sh/setup-uv@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@just
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Install JS + Python SDK dependencies
        run: |
          pnpm install --frozen-lockfile
          uv venv && uv pip install -e "packages/py[dev]"
      - name: Red suite fails exactly N per language (map red count)
        run: just test-red

  # ─── STAGE 6. SCORECARD AGGREGATOR ─────────────────────────
  # Runs ONLY after the platform jobs complete (needs:). Collects
  # the per-tier JUnit/JSON results and verifies every tier reported
  # before writing scorecard.md; the 254 total is asserted against
  # manifest truth, not against executed tests (no nextest tag maps
  # cases to Rust tests). A tier that skipped for lack of hardware
  # reports skipped-no-kvm explicitly; a failed tier fails this job.
  # NOTE: the 254 assertion matches manifest truth (total_cases: 254);
  # check-scorecard likewise gates on the committed scorecard.md
  # matching manifest truth.
  scorecard-aggregator:
    needs: [linux-kvm-tier, macos-hvf-tier, windows-whp-tier, sdk-parity-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Collect tier results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true
      - name: Verify every tier reported (254 invariants)
        run: |
          python3 - <<'EOF'
          import glob, json, sys
          expected = {"linux-kvm", "macos-hvf", "windows-whp", "sdk-parity"}
          found = {}
          for path in glob.glob("test-results/*.json"):
              with open(path) as f:
                  data = json.load(f)
              found[data["tier"]] = data["status"]
          missing = expected - set(found)
          if missing:
              print(f"ERROR: no tier result for: {sorted(missing)}")
              sys.exit(1)
          failed = [t for t, s in found.items() if s not in ("success", "skipped-no-kvm")]
          if failed:
              print(f"ERROR: tier(s) failed: {failed}: {found}")
              sys.exit(1)
          for t, s in sorted(found.items()):
              print(f"{t}: {s}")
              if s == "skipped-no-kvm":
                  print(f"::notice::Tier {t} skipped: no KVM on this runner; hardware cases not executed.")
          print("All collected tier results are success (or explicitly skipped-no-kvm).")
          EOF
      - name: Assert invariant total is 254
        run: |
          grep -q 'total_cases: 254' cans/artifacts/test-plan/manifest.yaml
      - name: Verify scorecard matches manifest truth
        run: just check-scorecard
      - name: Write scorecard.md
        run: just scorecard
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: cans/artifacts/scorecard.md

  # ─── KEPT NAMED JOBS (existing coverage, not a test-plan stage) ───
  # Mapping: build-guest-shim (shim cross-compile), test-core /
  # test-plugins / test-shim / test-drivers (nextest invocations over
  # crates with no test targets at base; `just test-unit` runs them
  # locally), panic-hunt (adversarial),
  # package-check (zero-toolchain packaging), plugin-graph /
  # layer-check / plugin-audit / verify-tiered-compilation (static
  # plugin audits), perf-budgets (hardware budget enforcement).

  # ─── GUEST SHIM CROSS-COMPILE ──────────────────────────────
  build-guest-shim:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mozilla-actions/sccache-action@v0.0.5
      - uses: taiki-e/install-action@cargo-zigbuild
      - name: Build Shim via Zig Linker
        run: cargo zigbuild -p kelir-shim --release --target ${{ matrix.target }}
      - name: Verify Size (<50KB binary constraint)
        run: |
          SIZE=$(stat -c%s target/${{ matrix.target }}/release/kelir-shim)
          echo "Shim size: $SIZE bytes"
          test $SIZE -lt 51200 || (echo "SHIM BLOAT DETECTED" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: kelir-shim-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kelir-shim

  # ─── CORE KERNEL + PLUGIN TESTKIT (NO TESTS AT BASE) ──
  test-core:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Core + testkit
        run: cargo nextest run -p kelir-engine -p kelir-plugin-testkit

  # ─── ADVERSARIAL INTEGRATION HARNESS (PANIC HUNT; NO panic_hunt TARGET AT BASE) ──────
  panic-hunt:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Adversarial Frame Fuzzing (no panic_hunt test target at base)
        run: cargo nextest run -p kelir-engine --test panic_hunt

  # ─── ZERO-TOOLCHAIN PACKAGING CHECK ────────────────────
  # Asserts precompiled NAPI binaries and Python wheels build cleanly
  # so consumers never require C/Rust compilers on target systems.
  package-check:
    needs: [sdk-parity-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: astral-sh/setup-uv@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify NAPI packaging
        run: pnpm --filter @kelir/core pack --dry-run
      - name: Verify Python wheel packaging
        run: uv build --package kelir

  # ─── PER-PLUGIN TEST MATRIX ─────────────────────────────
  # Each plugin cell runs nextest over its crate (no plugin tests at
  # base) against its explicit upstream dependencies.
  # A failure in one cell does not mask others (fail-fast: false).
  test-plugins:
    needs: [lint-and-types, test-core]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [chaos, container, db-proxy, ledger, mcp, mesh, profile, replay, supply-chain, tool-guard, transaction, vault, wire-ingress]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Nextest plugin-${{ matrix.plugin }} (no tests at base)
        run: cargo nextest run -p plugin-${{ matrix.plugin }}

  # ─── PLUGIN DEPENDENCY DAG CHECK ──────────────────────
  plugin-graph:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Validate Acyclic Plugin Dependency DAG
        run: cargo run -p kelir-plugin-cli -- check --graph

  # ─── LAYER CHECK (--layering-coverage) ────────────────
  # Same command as `just check-layers`. Validates downward-only
  # crate dependencies; core/interface violations reject the build.
  layer-check:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Validate Downward-Only Dependencies
        run: cargo run -p kelir-plugin-cli -- check --layers

  maturity-check:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Check Body Maturity Placement
        run: just check-maturity

  # ─── PLUGIN CONTRACT AUDIT ─────────────────────────────
  # Same command as `just check-plugin`. The audit that
  # 15-operations.md promises is actually executed here.
  plugin-audit:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [chaos, container, db-proxy, ledger, mcp, mesh, profile, replay, supply-chain, tool-guard, transaction, vault, wire-ingress]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Contract audit
        run: cargo run -p kelir-plugin-cli -- check -p plugin-${{ matrix.plugin }}

  # ─── CORE CHANNEL PIN + PLUGIN ATTESTATION (PLACEHOLDER) ──
  # Exercises the bump-core and attest subcommands
  # (15-operations.md#Developer-CLI). External plugin repos run the
  # same invocations via plugin-ci-reusable.yml; signing itself is L3.
  bump-core:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [released, main]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Pin core channel
        run: cargo run -p kelir-plugin-cli -- bump-core --channel ${{ matrix.channel }}

  attest:
    needs: [bump-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Sign attestation (placeholder)
        run: cargo run -p kelir-plugin-cli -- attest --sign --plugin-path crates/kelir-plugins/plugin-chaos

  # ─── TIERED PLUGIN COMPILATION ─────────────────────────
  # Plugins compile against their explicit upstream dependencies
  # (see 02-plugin-model.md#Plugin-tiering). One workspace check
  # covers every crate and target, plugins included. Runs under the
  # dev-min profile (incremental off, debug symbols off) to keep
  # CI caches small; same code, no semantic difference.
  verify-tiered-compilation:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Verify Tiered Plugin Compilation
        run: cargo check --profile dev-min --workspace --all-targets

  # ─── SHIM + DRIVER TESTS (NO TEST TARGETS AT BASE) ────────
  test-shim:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - run: cargo nextest run -p kelir-shim

  test-drivers:
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - name: Verify Pinned Test Oracles
        run: cargo run -p kelir-plugin-cli -- fixtures --verify
      - name: Driver tests (no driver-rustvmm/driver-bwrap tests at base; excludes real-hardware paths)
        run: cargo nextest run -p driver-rustvmm -p driver-bwrap -E 'not test(test_hw_)'
      # Compile-only: driver-avf (Android) and driver-proot (Termux) have
      # no CI test runner; same as just check-drivers.
      - name: Check untested drivers (avf, proot)
        run: cargo check -p driver-avf -p driver-proot

  # ─── PERFORMANCE BUDGET GATE (HARD ENFORCEMENT) ────────
  perf-budgets:
    needs: [test-core, test-drivers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert Latency and RSS Ceilings
        run: cargo run -p kelir-plugin-cli -- check --budgets perf/budgets.toml
