$schema: "test-plan/scenario/v1"
scenario_id: "sc_lifecycle_full_roundtrip"
title: "Boot → exec → write file → egress → checkpoint → rollback → resume → stop"
family: "lifecycle"
target_tier: "e2e"
languages: [rust, typescript, python]
fixture_ref: "fixtures/scenarios/full-roundtrip/"
steps:
  - ref: "tp_09_exec_stream_sublane_stdio_fidelity"
    assert: "stdout and stderr retain bitwise fidelity"
  - ref: "sp_04_storage_quota_enforcement_enospc"
    assert: "Exceeding max_bytes fails synchronously with ENOSPC"
  - ref: "wp_02_synthetic_dns_nxdomain_enforcement"
    assert: "DNS queries for undeclared external targets return synthetic NXDOMAIN before upstream forward"
  - ref: "lc_02_suspend_zero_rss_purge"
    assert: "host RSS drops to 0 MB"
  - ref: "lc_09_graceful_shutdown_syncfs_flushed"
    assert: "shim issues syncfs(2), sends SIGTERM, reaps children, replies MSG_SHUTDOWN_ACK"
anti_slop_assertions:
  - rule: "AS-03"
    verification: "each step outcome matches a typed surface (ExitKind::Normal, raw_os_error ENOSPC, DNS rcode 3) — no bare .is_ok() or .is_err() anywhere in the journey"
  - rule: "AS-02"
    verification: "the quota step pins broker.allocated_bytes() at the 10485760 ceiling rather than trusting the ENOSPC error alone"
  - rule: "AS-08"
    verification: "after the final suspend and stop, host RSS sits under the 15MB supervisor floor and /proc/self/fd holds zero session descriptors"
