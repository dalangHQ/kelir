$schema: "test-plan/case/v1"
case_id: "gv_08_in_ring_carrier_secret_injection"
title: "In-ring wire carrier substitutes vault:// placeholders with bearer <redacted> on outbound L7 streams; no external sidecar daemon"
domain: "governance_vault"
target_tier: "integration"
target_crate: "crates/kelir-plugins"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/plugins/vault.md#In-ring-carrier-secret-injection"
  statement: "Wire plane natively interposes outbound L7 streams matching vault rules and substitutes vault:// placeholders with real bearer <redacted> in flight; no external sidecar daemon exists, preserving strict Class 1 attestation. Unregistered placeholders fail closed with ENODATA and no token is emitted."
  blast_radius_if_breached: "Supervisor process memory dump exposes raw enterprise API tokens."

confusion_matrix:
  quadrant: "true_positive"
  slop_risk: "Agent asserts the placeholder was replaced without verifying the output carries no vault:// substring and a non-empty issued token."
  anti_slop_mitigation: "AS-01 asserts the injected stream contains no vault:// substring and a non-empty bearer token; AS-03 asserts the unregistered placeholder fails closed with ENODATA."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "vault.carrier"
    agent_id: "agt_gv_08"
    trust: "reviewed"
  initial_state:
    vault_credential:
      name: "openai_key"
      audience: "api.openai.com"
      scope: "read_write"
    tables: []
    vault_secrets: []

execution:
  trigger: "net_frame"
  command: "Guest sends outbound HTTP request carrying Authorization: Bearer vault://openai_key; CarrierInjector substitutes the placeholder in flight"
  input_params:
    placeholder: "vault://openai_key"

expected_observations:
  exit_code: 0
  state_modified: true
  diagnostic:
    domain: "vault.carrier"
    culprit: "none — carrier injected token in-ring"
    remedy: "none required"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 1
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "vault.token_issued"
    chain_valid: true
    state_modified_field: true
  receipt:
    exit_kind: "Normal"
    fault_reason: null

anti_slop_assertions:
  - rule: "AS-01"
    verification: "assert!(!injected.contains(\"vault://\")); assert!(issued_token_non_empty(injected));"
  - rule: "AS-03"
    verification: "assert!(matches!(inject(\"vault://unregistered\"), Err(VaultError::Enodata(_))));"
