$schema: "test-plan/case/v1"
case_id: "ad_02_expansion_ratio_15_to_1_abort"
title: "kelir-pack aborts compilation with E_LAYER_OVERSIZE when a layer expands beyond the 15 to 1 admission ratio"
domain: "adapters_ingestion"
target_tier: "e2e"
target_crate: "crates/kelir-adapters/kelir-pack"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/12-adapters.md#Ingestion-matrix"
  statement: "Streaming unpack admission clamps maximum expansion ratio to 15:1 (MAX_EXPANSION_RATIO: u32 = 15 in crates/kelir-adapters/kelir-pack/src/main.rs); a layer expanding past 15:1 aborts compilation with E_LAYER_OVERSIZE and emits no EROFS image. Gap: the ceiling is never enforced; fetch_manifest and phase1_scan_headers are L3 TODOs returning Err(PackError::FetchPending / Phase1Pending), and no code path returns PackError::LayerOversize."
  blast_radius_if_breached: "A zip-bomb layer exhausts host memory and disk during pull, denying service to every session on the host."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent asserts the build fails without checking that no EROFS output file was emitted and no CAS blob was written."
  anti_slop_mitigation: "AS-04B asserts the abort fires at the physical 15:1 budget boundary and zero output bytes land on disk."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "adapters.ingest"
    agent_id: "agt_ad_02"
    trust: "reviewed"
  initial_state:
    layer_digest: "sha256:ad02zipbomb"
    compressed_bytes: 1048576
    tables: []
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: "kelir-pack build oci-manifest.json rootfs.erofs with a 1 MiB layer expanding to 16 MiB"
  input_params:
    expansion_ratio: 16
    max_expansion_ratio: 15

expected_observations:
  exit_code: 1
  state_modified: false
  diagnostic:
    domain: "adapters.pack"
    culprit: "layer expansion 16:1 exceeds 15:1 admission clamp"
    remedy: "reject layer; emit no image"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "adapters.layer_oversize_abort"
    chain_valid: true
    state_modified_field: false
  receipt:
    exit_kind: "HypervisorFault"
    fault_reason: "E_LAYER_OVERSIZE"

anti_slop_assertions:
  - rule: "AS-04B"
    verification: "assert_matches!(run(args), Err(PackError::LayerOversize(_))); assert_eq!(output_exists('rootfs.erofs'), false);"
