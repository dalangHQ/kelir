$schema: "test-plan/case/v1"
case_id: "ad_01_radix_layer_unpack_whiteout_merge"
title: "kelir-pack phase 1 applies inline whiteouts to the radix tree so a deleted file never reaches the EROFS image"
domain: "adapters_ingestion"
target_tier: "e2e"
target_crate: "crates/kelir-adapters/kelir-pack"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/12-adapters.md#Ingestion-matrix"
  statement: "Phase 1 streams layer tar headers into a radix tree; inline whiteouts (.wh., .wh..wh..opq) mutate tree nodes in place, so a whited-out file and an opaque directory's hidden entries are absent from the emitted EROFS. Gap: whiteout application is a phase1_scan_headers L3 TODO in crates/kelir-adapters/kelir-pack/src/main.rs and RadixTree currently tracks inode_count only, so this case is specified against the spec text, not a live surface."
  blast_radius_if_breached: "Deleted files leak into the booted rootfs, resurrecting secrets and stale binaries the image author removed."

confusion_matrix:
  quadrant: "true_positive"
  slop_risk: "Agent asserts the EROFS image builds without checking the whited-out path is absent from the final tree."
  anti_slop_mitigation: "AS-04A asserts the radix tree contains zero nodes for the whited-out path after phase 1, under a pinned deterministic clock."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "adapters.ingest"
    agent_id: "agt_ad_01"
    trust: "reviewed"
  initial_state:
    layer_digest: "sha256:ad01whiteout"
    whiteout_entries: [".wh.secret", ".wh..wh..opq"]
    tables: []
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: "kelir-pack build oci-manifest.json rootfs.erofs with a layer deleting secret via .wh.secret"
  input_params:
    whiteout_path: ".wh.secret"
    opaque_dir: "/etc"

expected_observations:
  exit_code: 0
  state_modified: false
  diagnostic:
    domain: "adapters.pack"
    culprit: "none — whiteout merged in radix tree"
    remedy: "none required"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "adapters.layer_compiled"
    chain_valid: true
    state_modified_field: false
  receipt:
    exit_kind: "Normal"
    fault_reason: null

anti_slop_assertions:
  - rule: "AS-04A"
    verification: "assert_eq!(radix_tree.lookup('/secret'), None); assert_eq!(radix_tree.lookup('/etc/old.conf'), None);"
