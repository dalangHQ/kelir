$schema: "test-plan/case/v1"
case_id: "ad_09_mcp_console_framing_continuation"
title: "MCP_CONSOLE splits a JSON-RPC frame larger than 64 KB via FLAG_CONTINUATION and reassembles it exactly"
domain: "adapters_ingestion"
target_tier: "e2e"
target_crate: "crates/kelir-adapters/mcp-server"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/plugins/mcp.md#MCP-contract"
  statement: "MCP framing is JSON Lines with a 64 KB max frame; a larger frame is split via FLAG_CONTINUATION and reassembled byte-exact. Gap: no FLAG_CONTINUATION Rust surface exists in this tree (only a reassembly TODO comment in crates/kelir-plugins/plugin-tool-guard/src/jsonrpc.rs), so this case is specified against cans/plugins/mcp.md, not a live surface."
  blast_radius_if_breached: "A truncated or misordered continuation corrupts the JSON-RPC object and the tool call executes with wrong arguments."

confusion_matrix:
  quadrant: "true_positive"
  slop_risk: "Agent asserts the large call succeeds without checking the frame was split at exactly 64 KB and reassembled byte-exact."
  anti_slop_mitigation: "AS-04A asserts exactly two frames carry the 96 KB payload and the reassembled bytes equal the original."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "adapters.mcp"
    agent_id: "agt_ad_09"
    trust: "reviewed"
  initial_state:
    stream_kind: 18
    payload_bytes: 98304
    tables: []
    vault_secrets: []

execution:
  trigger: "vsock_frame"
  command: "mcp-server forwards a 98304 byte JSON-RPC frame over MCP_CONSOLE"
  input_params:
    payload_bytes: 98304
    max_frame_bytes: 65536

expected_observations:
  exit_code: 0
  state_modified: false
  diagnostic:
    domain: "adapters.mcp"
    culprit: "none — continuation frames reassembled exact"
    remedy: "none required"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "adapters.mcp_frame_bridged"
    chain_valid: true
    state_modified_field: false
  receipt:
    exit_kind: "Normal"
    fault_reason: null

anti_slop_assertions:
  - rule: "AS-04A"
    verification: "assert_eq!(frame_count(), 2); assert_eq!(reassembled_bytes(), original_bytes());"
