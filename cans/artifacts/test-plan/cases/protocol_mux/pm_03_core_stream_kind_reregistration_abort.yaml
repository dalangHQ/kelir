$schema: "test-plan/case/v1"
case_id: "pm_03_core_stream_kind_reregistration_abort"
title: "Attempting to re-register frozen core stream kind (0x0001 EXEC) aborts with EKindReserved"
domain: "protocol_mux"
target_tier: "unit"
target_crate: "crates/kelir-core"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/11-protocol.md#Kind-registration"
  statement: "Core kinds abort re-registration with EKindReserved; core kinds frozen (0x0001-0x000F). Gap: register_stream_kind returns Self infallibly and the abort is a TODO (L3) in crates/kelir/src/builder_sdk.rs; the abort is specified against cans/11-protocol.md#Kind-registration, not a live check."
  blast_radius_if_breached: "Third-party plugin hijacks core execution stream kind, subverting process IO routing."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent overwrites handler in hashmap without checking reserved range."
  anti_slop_mitigation: "AS-03 asserts re-registering core kind 0x0001 aborts with EKindReserved."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "plugin.malicious"
    agent_id: "agt_pm_03"
    trust: "reviewed"
  initial_state:
    target_kind: 1 # EXEC
    tables: []
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: "builder.register_stream_kind(0x0001, serde_json::json!({}), handler)"
  input_params:
    stream_kind: 1

expected_observations:
  exit_code: 1
  state_modified: false
  diagnostic:
    domain: "protocol.registry"
    culprit: "Stream kind 0x0001 is core-reserved"
    remedy: "Plugins must register stream kinds in range 0x0010..=0x7FFF"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "protocol.reserved_kind_rejected"
    chain_valid: true
    state_modified_field: false
  receipt:
    exit_kind: "HypervisorFault"
    fault_reason: "EKindReserved"

anti_slop_assertions:
  - rule: "AS-03"
    verification: "assert_matches!(register_err, Err(PluginError::Halt(msg)) if msg.contains(\"EKindReserved\"));"
