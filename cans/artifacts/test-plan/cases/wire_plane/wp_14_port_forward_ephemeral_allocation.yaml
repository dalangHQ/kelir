$schema: "test-plan/case/v1"
case_id: "wp_14_port_forward_ephemeral_allocation"
title: "session.wire.forward_port with host_port=0 allocates ephemeral host port and returns bound port u16"
domain: "wire_plane"
target_tier: "integration"
target_crate: "crates/kelir-engine"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/07-wire-plane.md#Port-forwarding"
  statement: "host_port = 0 binds ephemeral port 0; bound port returned immediately; zero collision probability. GAP: WirePlane::forward_port (crates/kelir-engine/src/planes/wire/mod.rs) is a stub that echoes the requested port (Ok(host_port.unwrap_or(guest_port))) with a TODO to bind a host socket, so no real ephemeral allocation happens yet and the >1024 assertion fails against the live tree."
  blast_radius_if_breached: "Parallel test suites conflict on hardcoded host listening ports."

confusion_matrix:
  quadrant: "true_positive"
  slop_risk: "Agent hardcodes a fallback port instead of querying OS socket name."
  anti_slop_mitigation: "AS-03 asserts returned port > 1024 and matches getsockname on the host listener."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "wire.forward"
    agent_id: "agt_wp_14"
    trust: "reviewed"
  initial_state:
    guest_port: 8080
    tables: []
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: "session.wire.forward_port(8080, Some(0))"
  input_params:
    host_port: 0

expected_observations:
  exit_code: 0
  state_modified: true
  diagnostic:
    domain: "wire.forward"
    culprit: "none — ephemeral port allocated"
    remedy: "none required"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "wire.port_forwarded"
    chain_valid: true
    state_modified_field: true
  receipt:
    exit_kind: "Normal"
    fault_reason: null

anti_slop_assertions:
  - rule: "AS-03"
    verification: "assert!(allocated_port > 1024); assert_eq!(allocated_port, host_listener_local_port());"
