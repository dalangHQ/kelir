$schema: "test-plan/case/v1"
case_id: "vr_04_virtio_rng_profile_immutable"
title: "Configuration profile attempting to remove or disable virtio-rng device fails validation with EConfig"
domain: "virtio_rings"
target_tier: "unit"
target_crate: "crates/kelir-engine"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/01-architecture.md#VirtIO-Device-Complex"
  statement: "virtio-rng is unconfigurable; profile cannot remove the device. GAP: no from_spec entry point, no KelirError type, and no profile-validation path exist in code — VmConfig (crates/kelir-interface/src/driver_interface.rs) has no virtio_rng field — and EConfig is a spec error code (cans/03-sdk-architecture.md:21, cans/plugins/profile.md:270) with no typed Rust surface, so this case asserts the spec-required behavior and fails against the live tree until profile validation is wired."
  blast_radius_if_breached: "Malicious profile removes entropy device, causing guest cryptographic failures."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent accepts profile with disabled RNG without validating mandatory device invariant."
  anti_slop_mitigation: "AS-03 requires exact EConfig('virtio-rng is mandatory') matching."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "agent.runtime"
    agent_id: "agt_vr_04"
    trust: "reviewed"
  initial_state:
    invalid_profile: "session.devices.virtio_rng.enabled = false"
    tables: []
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: "Profile with session.devices.virtio_rng.enabled=false is validated at boot"
  input_params:
    disable_rng: true

expected_observations:
  exit_code: 1
  state_modified: false
  diagnostic:
    domain: "profile.validator"
    culprit: "Profile attempted to disable mandatory virtio-rng device"
    remedy: "Remove virtio_rng.enabled=false; virtio-rng is mandatory"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "profile.validation_failed"
    chain_valid: true
    state_modified_field: false
  receipt:
    exit_kind: "HypervisorFault"
    fault_reason: "EConfig('virtio-rng is mandatory')"

anti_slop_assertions:
  - rule: "AS-03"
    verification: "assert!(boot_result.is_err()); assert!(receipt.fault_reason.contains('EConfig')); assert!(receipt.fault_reason.contains('virtio-rng'));"
