$schema: "test-plan/case/v1"
case_id: "bp_03_python_fused_trampoline_single_crossing_chained_hooks"
title: "AOT hook fusion collapses five chained Python hooks into exactly 1 FFI trampoline crossing"
domain: "bindings_py"
target_tier: "unit"
target_crate: "packages/py"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/02-plugin-model.md#Foreign-plugin-proxy"
  statement: "AOT hook fusion compiles chained host hooks into a single flat closure; exactly one FFI trampoline crossing per ring event regardless of hook count. GAP: the compiled flat closure is not yet real — packages/py/kelir/plugin_fusion.py FusedTrampoline.describe() returns a descriptor and carries TODO (L3) to compile each fused chain into the single flat closure, and crates/kelir-bindings/pyo3/src/lib.rs carries the matching L3 bind step; the single-crossing property is therefore asserted at the descriptor and trampoline-table level (crossings_per_ring_event() == 1), not by executing a compiled closure."
  blast_radius_if_breached: "Composing 5 Python hooks causes 5 consecutive FFI context switches per trap event."

confusion_matrix:
  quadrant: "true_positive"
  slop_risk: "Agent asserts all 5 hooks ran without measuring FFI trampoline boundary crossings."
  anti_slop_mitigation: "AS-01 asserts crossings_per_ring_event(RingEvent.TRAP) == 1 when 5 hooks execute."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "sdk.python"
    agent_id: "agt_bp_03"
    trust: "reviewed"
  initial_state:
    registered_hooks: 5
    tables: []
    vault_secrets: []

execution:
  trigger: "sdk"
  command: "FusedTrampoline.fuse() over 5 chained Python Trap pre-exec handlers"
  input_params:
    hook_count: 5
    ring: "trap"

expected_observations:
  exit_code: 0
  state_modified: true
  diagnostic:
    domain: "sdk.python"
    culprit: "none — fused into 1 trampoline"
    remedy: "none required"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "sdk.python.fused_hook_executed"
    chain_valid: true
    state_modified_field: true
  receipt:
    exit_kind: "Normal"
    fault_reason: null

anti_slop_assertions:
  - rule: "AS-01"
    verification: "assert_eq!(FusedTrampoline.fuse(hooks).crossings_per_ring_event(RingEvent.TRAP), 1); assert_eq!(FusedTrampoline.fuse(hooks).hook_count(RingEvent.TRAP), 5);"
