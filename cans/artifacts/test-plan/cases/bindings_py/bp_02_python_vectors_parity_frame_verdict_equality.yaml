$schema: "test-plan/case/v1"
case_id: "bp_02_python_vectors_parity_frame_verdict_equality"
title: "Python SDK reproduces every ./vectors.json frame byte-for-byte with the identical expected verdict"
domain: "bindings_py"
target_tier: "integration"
target_crate: "packages/py"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/15-operations.md#Multi-language-parity-gate"
  statement: "Parity is evaluated on identical wire frame inputs and outputs using ./vectors.json (repo root; the work-order path tests/vectors/vectors.json does not exist): the Python suite consumes all 58 vectors and reproduces each frame_hex byte-for-byte with the identical expected_verdict. GAP: no receipt equality is asserted — ./vectors.json contains zero receipt fields and crates/kelir-plugin-cli/src/parity_cli.rs compares frame bytes plus verdict-lattice membership only, while cans/15-operations.md#Multi-language-parity-gate also requires CI to diff the observed ExecutionReceipt per chain; no Py-side parity runner exists in packages/py (zero vectors.json references), so receipt-equality has no executable surface and is recorded here as a gap, not asserted."
  blast_radius_if_breached: "Python and Rust disagree on a wire frame or verdict, so the same trap input passes in one SDK and drops in the other."

confusion_matrix:
  quadrant: "true_positive"
  slop_risk: "Agent derives expected frame bytes by running the subject encoder instead of reading the literal frame_hex in ./vectors.json."
  anti_slop_mitigation: "AS-06 bans deriving expected values from subject output; expected frame_hex and expected_verdict are literals read from ./vectors.json."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "sdk.python"
    agent_id: "agt_bp_02"
    trust: "reviewed"
  initial_state:
    vectors_file: "./vectors.json"
    vector_count: 58
    tables: []
    vault_secrets: []

execution:
  trigger: "sdk"
  command: "kelir-plugin-cli parity run ./vectors.json over the Python SDK vector consumer"
  input_params:
    vectors_file: "./vectors.json"

expected_observations:
  exit_code: 0
  state_modified: false
  diagnostic:
    domain: "sdk.python"
    culprit: "none — all 58 vectors reproduce frame_hex and expected_verdict"
    remedy: "none required"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "sdk.python.vectors_parity_passed"
    chain_valid: true
    state_modified_field: false
  receipt:
    exit_kind: "Normal"
    fault_reason: null

anti_slop_assertions:
  - rule: "AS-06"
    verification: "assert_eq!(parity_asserted_vectors(\"./vectors.json\"), 58); assert!(frame_hex_matches_literal(0));"
