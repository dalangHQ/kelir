$schema: "test-plan/case/v1"
case_id: "hd_12_arm64_stage2_4k_on_16k_host"
title: "ARM64 Stage-2 tables map 4KB guest MMU leaves cleanly over 16KB host RAM pages without alignment faults"
domain: "hypervisor_driver"
target_tier: "integration"
target_crate: "crates/kelir-engine"
platform_target:
  os: "macos"
  arch: "aarch64"
  hypervisor: "hvf"

invariant:
  law_reference: "cans/01-architecture.md#Page-size-dynamic-boot-selection"
  statement: "ARM64 Stage-2 tables configure 4KB leaf pages on 16KB host RAM, eliminating binary alignment faults. GAP: no guest_page_size/host_page_size probe exists on any driver; the guest 4KB page size is observable only as VmConfig.page_size_kb, and 16KB host handling is driver-internal (L3). GAP: session.exec is the spec surface (cans/03-sdk-architecture.md:107); the live Rust SDK exposes session.spawn (crates/kelir/src/session_lifecycle.flow.rs:58) and guest exec dispatch is a TODO (L3) in SpawnBuilder::poll, so this case asserts the spec-required behavior and fails against the live tree until exec is wired."
  blast_radius_if_breached: "Standard x86/ARM64 4KB-aligned ELF packages crash on Apple Silicon with SIGBUS."

confusion_matrix:
  quadrant: "true_positive"
  slop_risk: "Agent asserts binary executed without checking that host page granularity is 16KB."
  anti_slop_mitigation: "AS-01 enforces real Stage-2 MMU translation probe on macOS ARM64."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "agent.runtime"
    agent_id: "agt_hd_12"
    trust: "reviewed"
  initial_state:
    driver_policy:
      backend: "driver-hvf"
      allow_emulated_fallback: false
    tables: []
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: "session.exec('/bin/4kb_aligned_elf', ProcessLimits::default()) on 16KB host page kernel"
  input_params:
    guest_page_size: 4096
    host_page_size: 16384

expected_observations:
  exit_code: 0
  state_modified: true
  diagnostic:
    domain: "driver.mmu"
    culprit: "none — Stage-2 translation table aligned 4K over 16K host pages"
    remedy: "none required"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "driver.mmu_configured"
    chain_valid: true
    state_modified_field: true
  receipt:
    exit_kind: "Normal"
    fault_reason: null

anti_slop_assertions:
  - rule: "AS-01"
    verification: "assert_eq!(vm_config.page_size_kb, 4);"
