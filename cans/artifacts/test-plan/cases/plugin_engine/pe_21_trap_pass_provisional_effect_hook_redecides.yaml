$schema: "test-plan/case/v1"
case_id: "pe_21_trap_pass_provisional_effect_hook_redecides"
title: "Trap Pass for an exec whose effect writes outside MountScope Drops at on_fs_write and dirties zero host bytes"
domain: "plugin_engine"
target_tier: "integration"
target_crate: "crates/kelir-core"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/02-plugin-model.md#Unified-interposition-pipeline"
  statement: "A trap Pass for an exec whose effect writes outside MountScope returns FilterAction::Drop { errno: Some(EPERM) } at on_fs_write; the trap verdict routes, it never authorizes the effect, and the final decision lands at the effect hook. Gap: trap dispatch and fs dispatch are never exercised as one pipeline in tests, so no test proves a trap Pass cannot authorize an out-of-scope write."
  blast_radius_if_breached: "A trap Pass becomes a blanket authorization, so an allowed exec writes anywhere on the host and MountScope is decorative."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent asserts the trap Passes and calls the case done, or accepts Forward for the out-of-scope write."
  anti_slop_mitigation: "AS-03 mandates exact matching on FilterAction::Drop with errno EPERM for the out-of-scope write; AS-02 asserts an in-scope write still Forwards."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "plugin.policy"
    agent_id: "agt_pe_21"
    trust: "reviewed"
  initial_state:
    tables: []
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: "dispatch_trap(allowed exec) returns Pass; dispatch_fs_write(out-of-scope path) returns FilterAction::Drop; dispatch_fs_write(in-scope path) returns Forward"
  input_params:
    binary: "git"
    out_of_scope_path: "/etc/passwd"
    in_scope_path: "/workspace/out.txt"

expected_observations:
  exit_code: 1
  state_modified: false
  diagnostic:
    domain: "plugin.policy"
    culprit: "Effect write escapes MountScope after trap Pass"
    remedy: "Write inside /workspace, or widen the declared scope"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "policy.effect_denied"
    chain_valid: true
    state_modified_field: false
  receipt:
    exit_kind: "Normal"
    fault_reason: null

anti_slop_assertions:
  - rule: "AS-03"
    verification: "assert_matches!(dispatch_fs_write(out_of_scope)?, FilterAction::Drop { errno: Some(e), .. } if e == \"EPERM\");"
  - rule: "AS-02"
    verification: "assert_matches!(dispatch_fs_write(in_scope)?, FilterAction::Forward);"
