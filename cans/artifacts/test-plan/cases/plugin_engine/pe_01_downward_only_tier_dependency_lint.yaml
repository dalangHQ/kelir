$schema: "test-plan/case/v1"
case_id: "pe_01_downward_only_tier_dependency_lint"
title: "Plugin crate attempting upward tier import fails layer check lint during tiered compilation"
domain: "plugin_engine"
target_tier: "unit"
target_crate: "crates/kelir-core"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/02-plugin-model.md#Plugin-tiering"
  statement: "Downward-only dependencies: higher tiers import lower-tier crates, never the reverse; Tier 1 direct core imports rejected. Gap: the live lint is kelir-plugin-cli layers::check() (kelir-plugin-cli check --layers), which scans source for forbidden crate prefixes (kelir_core:: / kelir_drivers::) only; no per-tier plugin-to-plugin rule exists, so a Tier 1 crate importing a Tier 3 plugin crate is not mechanically caught today."
  blast_radius_if_breached: "Architectural layering collapses, creating cyclic compilation dependencies and monolithic coupling."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent disables cargo layer check lint to allow upward dependency to pass."
  anti_slop_mitigation: "AS-01 runs layers::check() over the tree and asserts the Tier 1 to Tier 3 import is rejected."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "ci.linter"
    agent_id: "agt_pe_01"
    trust: "reviewed"
  initial_state:
    mock_tier1_crate: "plugin-mcp"
    tables: []
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: "kelir-plugin-cli check --layers with plugin-mcp (Tier 1) importing plugin-ledger (Tier 3)"
  input_params:
    target_tier: 1
    illegal_dep: "plugin-ledger"

expected_observations:
  exit_code: 1
  state_modified: false
  diagnostic:
    domain: "plugin.layering"
    culprit: "Layering violation: Tier 1 plugin cannot import Tier 3 plugin-ledger"
    remedy: "Downward dependencies only; communicate via ServiceRegistry or EventBus"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "ci.layering_violation_caught"
    chain_valid: true
    state_modified_field: false
  receipt:
    exit_kind: "HypervisorFault"
    fault_reason: "layer violation"

anti_slop_assertions:
  - rule: "AS-01"
    verification: "assert!(layers::check().unwrap_err().to_string().contains(\"layer violation\"));"
