$schema: "test-plan/case/v1"
case_id: "pe_19_env_xargs_reexec_unwrap_drops_git_push_force"
title: "Trap for env git push --force resolves through the re-exec wrapper to git push and Drops with EPERM"
domain: "plugin_engine"
target_tier: "unit"
target_crate: "crates/kelir-engine"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/11-protocol.md#Trap-fast-path"
  statement: "A trap whose first layer is env re-execing git push --force returns Verdict::Drop { errno: Some(EPERM) } from a policy row denying git push --force; env, xargs, and find -exec re-exec count as unwrap steps. Gap: no unwrapping exists yet (resolve_canonical returns CanonicalResolvePending), so the env binary never matches the git row."
  blast_radius_if_breached: "Every wrapper-wrapped exec bypasses trap policy, so an agent routes any denied command through env or xargs and the git gate is decorative."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent asserts Drop for a direct git push --force and calls the case done, or accepts Pass for the env form."
  anti_slop_mitigation: "AS-03 mandates exact matching on Verdict::Drop with errno EPERM for the env form; AS-02 asserts the direct git push --force form Drops too."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "plugin.policy"
    agent_id: "agt_pe_19"
    trust: "reviewed"
  initial_state:
    tables: []
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: "dispatch_trap(env git push --force) against a git push --force deny row; dispatch_trap(git push --force) as positive control"
  input_params:
    binary: "env"
    reexec_target: "git"
    deny_row: "git push --force"

expected_observations:
  exit_code: 1
  state_modified: false
  diagnostic:
    domain: "plugin.policy"
    culprit: "Re-exec wrapper unwraps to denied git push --force"
    remedy: "Run the push without --force, or request approval"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "policy.trap_denied"
    chain_valid: true
    state_modified_field: false
  receipt:
    exit_kind: "Normal"
    fault_reason: null

anti_slop_assertions:
  - rule: "AS-03"
    verification: "assert_matches!(dispatch_trap(env_git_event)?, Verdict::Drop { errno: Some(e), .. } if e == \"EPERM\");"
  - rule: "AS-02"
    verification: "assert_matches!(dispatch_trap(direct_git_event)?, Verdict::Drop { errno: Some(e), .. } if e == \"EPERM\");"
