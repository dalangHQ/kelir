$schema: "test-plan/case/v1"
case_id: "pe_02_cyclic_dependency_graph_abort"
title: "Cyclic crate dependencies in plugin registration graph abort microVM compilation with EConfig"
domain: "plugin_engine"
target_tier: "unit"
target_crate: "crates/kelir-core"
platform_target:
  os: "any"
  arch: "any"
  hypervisor: "none"

invariant:
  law_reference: "cans/02-plugin-model.md#Plugin-tiering"
  statement: "Direct Cargo dependencies are acyclic; cyclic crate dependencies abort compilation with EConfig. Gap: no registration-graph cycle detection exists in the live tree; resolve_plugin_registrations() only validates shape and dedupes, and Session::boot_with_engine returns Err(PluginError::Halt(\"TODO (L3): Session::boot\")) before any graph check."
  blast_radius_if_breached: "Infinite initialization loops lock up hypervisor microkernel bootstrap."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent ignores graph cycle and enters recursion or deadlock."
  anti_slop_mitigation: "AS-03 asserts Session::boot_with_plugins returns Err(PluginError::Halt) mentioning the cycle upon cycle detection."

setup:
  env: "ci"
  platform_tier: "tier_1"
  caller_identity:
    principal: "builder.registry"
    agent_id: "agt_pe_02"
    trust: "reviewed"
  initial_state:
    cyclic_plugins: ["plugin_a -> plugin_b", "plugin_b -> plugin_a"]
    tables: []
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: "Session::boot_with_plugins(config, &[plugin_a, plugin_b])"
  input_params:
    detect_cycles: true

expected_observations:
  exit_code: 1
  state_modified: false
  diagnostic:
    domain: "plugin.graph"
    culprit: "Cyclic dependency detected: plugin_a -> plugin_b -> plugin_a"
    remedy: "Break cycle by decoupling shared types into kelir-interface"
  database:
    row_count_delta: 0
    tables_mutated: []
  storage:
    upper_bytes_dirtied: 0
    tombstones_created: 0
    host_blocks_allocated: 0
  wire:
    frames_outbound: 0
    frames_inbound: 0
    trapped_syscalls: []
    synthetic_responses: []
  audit:
    event_emitted: "plugin.cyclic_dependency_aborted"
    chain_valid: true
    state_modified_field: false
  receipt:
    exit_kind: "HypervisorFault"
    fault_reason: "EConfig('Cyclic dependency')"

anti_slop_assertions:
  - rule: "AS-03"
    verification: "assert_matches!(boot_res, Err(PluginError::Halt(msg)) if msg.contains('Cyclic dependency'));"
