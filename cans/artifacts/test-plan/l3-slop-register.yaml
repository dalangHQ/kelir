- case_id: ad_01_radix_layer_unpack_whiteout_merge
  status: red
  domain: adapters_ingestion
  target_crate: crates/kelir-adapters/kelir-pack
  slop_risks:
  - EROFS image builds and the whited-out /secret path is still present in the emitted tree
  - Opaque directory /etc keeps its hidden entries because .wh..wh..opq never mutates the radix node
  - Build asserts exit 0 without ever looking up the deleted path in the radix tree
  must_not:
  - Never treat a successful build as proof; lookup of the whited-out path must return None
  - Never apply whiteouts after EROFS emit; mutation happens in phase 1 in place
  acceptance:
  - radix_tree.lookup('/secret') is None and lookup('/etc/old.conf') is None after phase 1 (AS-04A)
  - adapters.layer_compiled audit event emitted with receipt exit_kind Normal
  code_todos:
  - crates/kelir-adapters/kelir-pack/src/main.rs
- case_id: ad_02_expansion_ratio_15_to_1_abort
  status: red
  domain: adapters_ingestion
  target_crate: crates/kelir-adapters/kelir-pack
  slop_risks:
  - Build fails with FetchPending/Phase1Pending while the 16 MiB layer is still unpacked to disk
  - Abort fires but a partial rootfs.erofs or CAS blob is left on disk
  - Ratio checked against whole-image bytes instead of the single layer's 15:1 budget
  must_not:
  - Never return a generic error; abort must be PackError::LayerOversize
  - Never emit any output bytes when the ratio is exceeded
  acceptance:
  - run() returns Err(PackError::LayerOversize) for the 1 MiB -> 16 MiB layer
  - output_exists('rootfs.erofs') is false and zero CAS blobs written (AS-04B)
  code_todos: []
- case_id: ad_03_single_layer_8gib_ceiling_enforcement
  status: red
  domain: adapters_ingestion
  target_crate: crates/kelir-adapters/kelir-pack
  slop_risks:
  - Ceiling enforced per whole image, so an 8 GiB + 1 byte single layer passes inside a small image
  - Build fails with FetchPending instead of PackError::LayerOversize at the 8 GiB boundary
  - Partial EROFS output remains on disk after the abort
  must_not:
  - Never check the ceiling against total image bytes; it is per-layer, strictly 8 GiB
  - Never emit output bytes past the ceiling
  acceptance:
  - Err(PackError::LayerOversize) for the 8589934593-byte layer
  - No rootfs.erofs emitted; adapters.layer_oversize_abort audit event with fault_reason E_LAYER_OVERSIZE
  code_todos: []
